x;background:white;color:var(--ink);width:100%;outline:none}.field textarea{min-height:130px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(23,107,99,.1)}.tabrow{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.tabrow button{border:1px solid var(--line);border-radius:99px;background:white;padding:8px 12px;font-size:11px;font-weight:800;color:var(--muted)}.tabrow button.active{background:var(--nav);border-color:var(--nav);color:white}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#63747a;background:#f7f9f7}.qa{border:1px solid var(--line);border-radius:13px;background:white;overflow:hidden}.qa summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:12px}.qa summary::-webkit-details-marker{display:none}.qa summary:after{content:"＋";color:var(--teal);font-size:16px}.qa[open] summary:after{content:"−"}.qa .inside{padding:0 16px 16px;font-size:13px}.answer{white-space:pre-wrap;line-height:1.7;background:#f7f9f7;border:1px solid var(--line);border-radius:11px;padding:14px;font-size:13px}.pill{border-radius:999px;padding:4px 8px;background:#eef2ef;color:#53665e;font-size:10px;font-weight:800}.toast{position:fixed;bottom:20px;right:20px;z-index:80;background:#1c353e;color:white;border-radius:11px;padding:11px 15px;font-size:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(9px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.hide{display:none!important}.smallcaps{text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:850;color:var(--muted)}.selectable{cursor:pointer}.selectable:hover{border-color:#a7c9bd}.questionrow{padding:13px 0;border-bottom <script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STORE='qf_mastery_lab_v1';
const blankState=()=>({mastered:{},rubrics:{},notes:{},reviews:{},quiz:{done:0,right:0,attempts:{}},procedure:{},acf:{},days:{},started:new Date().toISOString().slice(0,10)});
let state=loadState();
function loadState(){try{return {...blankState(),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){return blankState()}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){/* Local-file / private-mode fallback: session remains usable without persistence. */}updateTopProgress()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2300)}
function pct(a,b){return b?Math.round(a/b*100):0}
function markCount(){return Object.values(state.mastered).filter(Boolean).length}
function updateTopProgress(){const el=$('#topProgress');if(el)el.textContent=`${markCount()}/10 mastered`;}
function nav(view){if(typeof mockSession!=='undefined'&&mockSession&&!mockSession.submitted&&view!=='mock'){if(!confirm('You have an exam attempt in progress. Leave and abandon this attempt?'))return;clearInterval(mockTimer);mockSession=null;}$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$$('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+view));window.scrollTo({top:0,behavior:'smooth'});if(view==='home')renderHome();if(view==='answers')renderAnswers();if(view==='theory')renderTheory();if(view==='procedures')renderProcedures();if(view==='calcs')renderCalcs();if(view==='acf')renderAcf();if(view==='cards')renderCards();if(view==='mock'){if(typeof mockSession!=='undefined'&&mockSession&&!mockSession.submitted)renderMockQuestion();else renderMock();}if(view==='progress')renderProgress()}
$$('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.view)));
$('#printBtn').onclick=()=>window.print();
$('#resetBtn').onclick=()=>{if(confirm('Reset all saved progress, notes and reviews on this browser?')){state=blankState();save();renderHome();toast('Local progress reset.')}};
$('#exportBtn').onclick=exportProgress;

const questions=[
{id:1,title:'What is forecast encompassing?',short:'Encompassing',marks:5,level:'high',area:'Forecast comparison',prompt:'Define forecast encompassing and describe how to test whether A encompasses B.',summary:'One forecast encompasses another when it contains all the predictive information in the other forecast, and possibly additional information. The course tests this using a regression of the realised value on both forecasts and two joint coefficient restrictions.',answer:`<h4>Definition</h4><p>Forecast <strong>A encompasses forecast B</strong> if A exploits all the information used by B in forecasting the target variable, and possibly additional information. Conditional on A, B contributes no further useful predictive information.</p><h4>Procedure: encompassing regression</h4><div class="formula">Yₜ₊₁ = β₁ Ŷᴬₜ₊₁ + β₂ Ŷᴮₜ₊₁ + uₜ₊₁</div><p>Estimate the regression of the realised outcome on both competing forecasts. Then conduct the following <strong>joint</strong> tests (not merely two isolated coefficient t-tests):</p><div class="formula">H₀ᴬ: β₁ = 1 and β₂ = 0<br>H₁ᴬ: β₁ ≠ 1 or β₂ ≠ 0</div><div class="formula">H₀ᴮ: β₁ = 0 and β₂ = 1<br>H₁ᴮ: β₁ ≠ 0 or β₂ ≠ 1</div><p>Use an appropriate joint restriction test, typically a Wald/F test in the regression framework or the equivalent χ² test in the guide's reported asymptotic examples. At significance level α, reject a null when its p-value is below α (or when the statistic is in the rejection region).</p><h4>Interpretation</h4><ul><li><strong>Fail to reject H₀ᴬ:</strong> the data are consistent with A encompassing B.</li><li><strong>Fail to reject H₀ᴮ:</strong> the data are consistent with B encompassing A.</li><li><strong>Reject both:</strong> neither forecast encompasses the other; a combination may use information from both.</li><li><strong>Fail to reject both:</strong> do not claim both forecasts are definitively optimal. The guide notes that imprecise estimates / poor forecasts can make the tests unable to distinguish them; the result is inconclusive.</li></ul><div class="callout"><strong>Why this matters:</strong> if one forecast encompasses the other, combining them is not necessary to recover extra information. If neither encompasses the other, combination is worth investigating.</div>`,rubric:['Give the definition: A contains all relevant information in B, possibly more.','Write the realised-value-on-two-forecasts regression correctly.','State H₀ᴬ: β₁=1, β₂=0 and its alternative.','State H₀ᴮ: β₁=0, β₂=1 and its alternative.','Explain the joint-test decision and what rejection/non-rejection implies.'],pitfalls:['Do not reverse the coefficients for the A and B nulls.','Do not say “accept H₀”; say “fail to reject”.','Do not infer that neither model is useful just because both nulls are rejected.','Do not automatically combine if one forecast clearly encompasses the other.'],quick:'If H₀ᴬ cannot be rejected, A encompasses B; if H₀ᴮ cannot be rejected, B encompasses A. If both are rejected, neither encompasses the other and combination can be considered.',source:'Subject Guide 2026, Chapter 12.3; Fall Mock 2024, Question 2(a), marking key.'},
{id:2,title:'How do you construct an optimal forecast from two forecasts?',short:'Optimal combination',marks:5,level:'high',area:'Forecast combination',prompt:'Derive the optimal convex combination of two unbiased forecasts with correlated errors.',summary:'Write the combined error as a weighted sum of individual errors, expand its MSE using the error covariance, differentiate with respect to the weight, and verify the second-order condition.',answer:`<h4>1. Set up the combination</h4><p>For forecasts Ŷ¹ and Ŷ², define a convex combination:</p><div class="formula">Ŷᶜ = ωŶ¹ + (1−ω)Ŷ², &nbsp; 0 ≤ ω ≤ 1</div><p>Let eᵢ = Y−Ŷⁱ, with unbiased forecast errors E(e₁)=E(e₂)=0, standard deviations σ₁ and σ₂, and correlation ρ.</p><h4>2. Derive its error and MSE</h4><div class="formula">eᶜ = Y−Ŷᶜ = ωe₁ + (1−ω)e₂</div><p>Since the component errors have zero means, the combined forecast is unbiased. Its MSE is its error variance:</p><div class="formula">MSE(ω) = ω²σ₁² + (1−ω)²σ₂²<br>+ 2ω(1−ω)ρσ₁σ₂</div><h4>3. First-order condition</h4><p>Differentiate and set equal to zero:</p><div class="formula">∂MSE/∂ω = 2ωσ₁² − 2(1−ω)σ₂²<br>+ 2ρσ₁σ₂(1−2ω) = 0</div><p>Collect the terms in ω:</p><div class="formula">ω(σ₁²+σ₂²−2ρσ₁σ₂) = σ₂²−ρσ₁σ₂</div><p>Therefore:</p><div class="formula">ω* = (σ₂²−ρσ₁σ₂) / (σ₁²+σ₂²−2ρσ₁σ₂)</div><h4>4. Second-order condition</h4><div class="formula">∂²MSE/∂ω² = 2(σ₁²+σ₂²−2ρσ₁σ₂) ≥ 0</div><p>It is positive except for the degenerate case in which the two errors are perfectly identical (up to scale), so the interior solution minimises MSE when it lies in the allowed interval.</p><h4>5. Special case: equally accurate forecasts</h4><p>If σ₁=σ₂=σ, then ω*=1/2 and:</p><div class="formula">MSE(Ŷᶜ) = ½ σ²(1+ρ)</div><p>The gain from averaging is larger when the forecast errors are less positively correlated. Two equally accurate forecasts with highly correlated errors provide less diversification benefit than two forecasts whose errors are weakly correlated.</p><div class="callout warn"><strong>Assumption check:</strong> the restricted convex combination in this derivation is designed for unbiased forecasts. The Subject Guide also shows a more flexible regression with an intercept and two unrestricted coefficients when combining biased forecasts.</div>`,rubric:['Define the convex combination and its weight restriction.','Express combined forecast error as ωe₁+(1−ω)e₂.','Expand MSE including the covariance term 2ω(1−ω)ρσ₁σ₂.','Differentiate, solve the FOC and give ω*.','Verify the SOC; state the equal-accuracy result and role of ρ.'],pitfalls:['Dropping the covariance term when errors are correlated.','Using covariance ρσ₁σ₂ incorrectly as ρ alone.','Forgetting to establish unbiasedness of the combined forecast.','Ignoring the convex restriction: if the unconstrained ω* lies outside [0,1], the constrained optimum is at a boundary.','Applying the restricted formula to biased forecasts without qualification.'],quick:'The optimal weight is not generally 1/2: it depends on both forecast error variances and their correlation. Equal accuracy gives equal weights, and the combined MSE is ½σ²(1+ρ).',source:'Subject Guide 2026, Chapter 12.3.2; Fall Mock 2024, Question 2(b)–(d), official solution.'},
{id:3,title:'What is the difference between in-sample and out-of-sample forecasting?',short:'In-sample vs out-of-sample',marks:5,level:'high',area:'Forecast evaluation',prompt:'Define in-sample and out-of-sample forecasting, explain the data split and why the distinction matters.',summary:'In-sample fitted predictions use observations that were involved in estimating the model. Out-of-sample forecasts are evaluated on a holdout period not used to estimate that forecast model, using only information that would have been available at the forecast origin.',answer:`<h4>Definitions</h4><p><strong>In-sample prediction</strong> is generated for observations in the sample used to estimate the model's parameters. It measures how well the fitted model describes the estimation data.</p><p><strong>Out-of-sample forecasting</strong> evaluates forecasts for observations in a separate holdout period that was not used to estimate the model parameters. At each forecast origin, the forecaster must use only information available at that date.</p><h4>How to construct an out-of-sample exercise</h4><div class="steps"><div class="step"><div><strong>Split the chronological data.</strong><br>Use an initial estimation/training sample and reserve later observations as the forecast evaluation sample.</div></div><div class="step"><div><strong>Estimate the model using only the initial sample.</strong><br>Do not use holdout observations when fitting the parameters or selecting information unavailable at the forecast origin.</div></div><div class="step"><div><strong>Generate forecasts for the holdout observations.</strong><br>Record forecasts before using the realised future values.</div></div><div class="step"><div><strong>Evaluate forecast errors.</strong><br>Compare actual values with forecasts using a loss measure such as squared error / MSE, and use statistical tests when appropriate.</div></div></div><h4>Why the distinction matters</h4><p>In-sample fit can be optimistic because the same observations helped determine model parameters; a model with many parameters may fit noise (overfit). Out-of-sample evaluation better reflects the forecasting task faced in practice, because the future observations were unavailable at the time the forecast was made.</p><p>The Subject Guide notes that full-sample “forecasts” are not realistic: genuine forecasts must use only data available at the time. It recommends generating and analysing out-of-sample forecasts wherever possible.</p><div class="callout warn"><strong>Wording trap in a past-paper key:</strong> one supplied answer describes the holdout sample awkwardly as values “not in the holdout sample”. The intended distinction is: the forecast evaluation observations are in the holdout sample and are not used to estimate the model. Avoid reproducing that typo.</div>`,rubric:['Define in-sample predictions as using the estimation data.','Define out-of-sample forecasts as forecasts evaluated on holdout observations not used for fitting.','Explain chronological split / holdout construction.','State information available at the forecast origin only.','Explain overfitting / realistic forecast-performance evaluation.'],pitfalls:['Do not say out-of-sample observations are “not in the holdout sample”.','Do not use future information to estimate or select the model at an earlier forecast origin.','Do not equate a high in-sample R² with good forecast accuracy.'],quick:'In-sample predictions use the estimation observations; out-of-sample forecasts are evaluated on a later holdout sample not used for fitting, and must use only information available at the forecast origin.',source:'Subject Guide 2026, Chapters 11 and 13; Fall Mock 2025, Question 4(e), marking key.'},
{id:4,title:'How do we obtain AR(∞) and MA(∞) representations?',short:'AR∞ and MA∞',marks:5,level:'high',area:'ARMA representations',prompt:'Explain the operator method for obtaining the infinite moving-average and infinite autoregressive representations, and state the relevant conditions.',summary:'Write the centred ARMA model in lag-operator form. Invert the AR polynomial for the causal MA(∞) representation; invert the MA polynomial for the invertible AR(∞) representation.',answer:`<h4>Start from a centred ARMA(p,q)</h4><div class="formula">φ(L)(Yₜ−μ) = θ(L)εₜ</div><p>Here φ(L)=1−φ₁L−…−φₚLᵖ, θ(L)=1+θ₁L+…+θqLq (sign conventions can vary; retain the polynomial actually supplied).</p><h4>A. MA(∞) representation: invert the AR polynomial</h4><p>If the process is causal / stationary, the roots of φ(z)=0 lie outside the unit circle. Then the inverse 1/φ(L) can be expanded as an infinite power series:</p><div class="formula">Yₜ−μ = [θ(L)/φ(L)]εₜ<br>= ψ(L)εₜ = Σⱼ₌₀^∞ ψⱼ εₜ₋ⱼ</div><p>For a simple AR(1), Yₜ−μ=φ(Yₜ₋₁−μ)+εₜ, with |φ|&lt;1. Repeated substitution gives:</p><div class="formula">Yₜ−μ = εₜ + φεₜ₋₁ + φ²εₜ₋₂ + …<br>= Σⱼ₌₀^∞ φʲ εₜ₋ⱼ</div><p>The coefficients decay because |φ|&lt;1. This representation expresses the current variable as the accumulated effect of current and past innovations.</p><h4>B. AR(∞) representation: invert the MA polynomial</h4><p>If the process is invertible, the roots of θ(z)=0 lie outside the unit circle. Then:</p><div class="formula">εₜ = [φ(L)/θ(L)](Yₜ−μ)<br>= π(L)(Yₜ−μ)</div><p>This can be rearranged as an autoregression with infinitely many lags of Y and the current innovation.</p><p>Example: for MA(1), Yₜ−μ=εₜ+θεₜ₋₁, so εₜ=(Yₜ−μ)−θεₜ₋₁. Substitute recursively:</p><div class="formula">εₜ = (Yₜ−μ) − θ(Yₜ₋₁−μ)<br>+ θ²(Yₜ₋₂−μ) − θ³(Yₜ₋₃−μ)+…</div><p>This converges when |θ|&lt;1. It gives the AR(∞) representation of the MA(1).</p><div class="callout"><strong>Memory rule:</strong> MA(∞) comes from inverting AR (causality/stationarity); AR(∞) comes from inverting MA (invertibility). Do not swap the two conditions.</div>`,rubric:['Write the centred ARMA model using φ(L) and θ(L).','Explain that the MA(∞) representation is obtained by inverting φ(L).','State the causality/stationarity root condition.','Explain that the AR(∞) representation is obtained by inverting θ(L).','State the invertibility root condition and show a valid recursive example.'],pitfalls:['Swapping the AR-root and MA-root conditions.','Forgetting to centre the process when writing the representation around μ.','Writing only the final series without explaining the inversion / recursive substitution.','Using |θ|<1 as the general condition for every higher-order MA; it is the MA(1) special case.'],quick:'Causal MA(∞): (Y−μ)=θ(L)/φ(L)·ε, requiring AR roots outside the unit circle. Invertible AR(∞): ε=φ(L)/θ(L)·(Y−μ), requiring MA roots outside the unit circle.',source:'Subject Guide 2026, Chapter 4.2 (including recursive MA(1) derivation); exam key allows AR(∞) + likelihood route for an ARMA estimation question.'},
{id:5,title:'What are the properties of an optimal forecast?',short:'Optimal forecast properties',marks:5,level:'high',area:'Forecast optimality',prompt:'Define optimality under a general loss function and state the properties of optimal forecast errors under quadratic / MSE loss.',summary:'Optimality is defined relative to a loss function. The conditional mean is optimal under quadratic loss. The supplied marking key lists four error properties; any three earn full marks in the referenced question.',answer:`<h4>General definition: optimality depends on the loss function</h4><div class="formula">Ŷ*ₜ₊ₕ|ₜ = arg minᵧ̂ Eₜ[L(Yₜ₊ₕ, Ŷ)]</div><p>An optimal forecast minimises expected loss conditional on the information set available at the forecast origin. It is therefore not meaningful to state the optimal forecast without specifying the loss function.</p><table><thead><tr><th>Loss function</th><th>Optimal point forecast</th></tr></thead><tbody><tr><td>Quadratic / squared-error</td><td>Conditional mean Eₜ(Yₜ₊ₕ)</td></tr><tr><td>Absolute-error</td><td>Conditional median</td></tr><tr><td>Asymmetric absolute-error</td><td>Conditional quantile determined by the asymmetry parameter</td></tr></tbody></table><h4>Under quadratic (MSE) loss: properties of the optimal forecast error</h4><p>Let e*ₜ₊ₕ|ₜ = Yₜ₊ₕ − Ŷ*ₜ₊ₕ|ₜ. The Study Guide and marking key state:</p><ol><li><strong>Unbiasedness:</strong> Eₜ(e*ₜ₊ₕ|ₜ)=0. By iterated expectations, the unconditional mean error is also zero.</li><li><strong>No predictable serial correlation at relevant lags:</strong> h-step optimal forecast errors have zero autocorrelation at lags greater than or equal to h. For h=1, the forecast errors are white noise.</li><li><strong>Non-decreasing forecast-error variance:</strong> Varₜ(e*ₜ₊ₕ|ₜ) is non-decreasing as h increases; the mark scheme also states that it converges to the unconditional variance of the process.</li><li><strong>Finite-order error representation:</strong> the h-step-ahead optimal forecast error is at most MA(h−1).</li></ol><div class="callout warn"><strong>Answer the question precisely:</strong> if asked for “three properties”, name and explain any three of the four above. If it asks for the properties “under MSE”, do not present them as universal properties under every possible loss.</div><h4>Why are there different lists?</h4><p>The general definition covers all losses; the conditional mean / median / quantile result changes with the loss. The four error restrictions above are the course's stated testable implications under MSE. The marking key treats any three as sufficient for its five-mark question.</p>`,rubric:['Define optimal forecast as minimising conditional expected loss.','State that the optimum depends on the loss function.','Identify conditional mean as optimal under MSE (and distinguish median / quantile under other losses if relevant).','State at least three correct MSE error properties.','Explain at least one property rather than listing labels only.'],pitfalls:['Calling the conditional mean optimal for every loss.','Giving only “unbiased, efficient, consistent” without the course’s precise error restrictions.','Saying h-step errors are white noise for all h; the one-step result is the white-noise case.','Forgetting the non-decreasing forecast-error variance property.'],quick:'General optimality is loss-minimisation. Under MSE the conditional mean is optimal; its errors are unbiased, have no autocorrelation from lag h onward, have non-decreasing variance in h, and are at most MA(h−1).',source:'Subject Guide 2026, Chapter 11.3.1; Fall Mock 2025 forecast-optimality question and official marking key.'},
{id:6,title:'What is the Box–Jenkins procedure?',short:'Box–Jenkins',marks:5,level:'high',area:'ARMA modelling',prompt:'Describe the aim and all stages of the Box–Jenkins approach, including what is checked in diagnostic analysis.',summary:'A practical iterative three-stage approach: identification, estimation, diagnostic checking. The final model should be stationary, parsimonious and adequately capture the dynamics.',answer:`<h4>Aim</h4><p>The Box–Jenkins approach provides a systematic, practical procedure for specifying, estimating and checking an ARMA model that captures the dynamic features of a time series.</p><div class="steps"><div class="step"><div><strong>1. Identification</strong><p>Inspect the time-series plot, sample ACF and PACF; assess stationarity; determine plausible orders p and q. If the series is non-stationary, identify an appropriate transformation / differencing before fitting a stationary ARMA model.</p></div></div><div class="step"><div><strong>2. Estimation</strong><p>Estimate parameters for the candidate models identified in stage 1. The lecture distinguishes AR estimation (OLS can be used) from MA / ARMA estimation, where innovations are unobserved and maximum likelihood is generally used.</p></div></div><div class="step"><div><strong>3. Diagnostic checking</strong><p>Examine residuals for remaining linear dependence / autocorrelation, heteroskedasticity and structural change. Use residual correlograms and an appropriate portmanteau test such as Ljung–Box. Compare candidate models with AIC/BIC and prefer a parsimonious model with adequate residual behaviour.</p></div></div></div><p>The procedure is iterative: if diagnostics reveal problems, revise the specification, re-estimate and check again.</p><div class="callout"><strong>Exam-ready ending:</strong> the objective is not simply to maximise in-sample fit; it is to choose a stationary, parsimonious model that is consistent with the data and whose residuals show no important unexplained dynamics.</div>`,rubric:['State the purpose: systematic ARMA model specification and estimation.','Identification: plot, ACF/PACF, stationarity and candidate p/q.','Estimation: estimate candidate model parameters.','Diagnostic checking: residual dependence, heteroskedasticity / structural change; tests.','State parsimony / adequacy and iterative model revision.'],pitfalls:['Omitting diagnostic checking or describing it as “look at R²”.','Confusing ACF/PACF identification with residual diagnostic ACF/PACF.','Selecting the lowest AIC/BIC without checking residual adequacy.','Saying OLS is used for every ARMA model.'],quick:'Identification → estimation → diagnostic checking. The model is revisited if residuals show unexplained dependence, heteroskedasticity or structural change; final choice should be stationary, parsimonious and adequate.',source:'Lecture 3 slides, Box–Jenkins model selection; past-paper question and marking key, 5 points.'},
{id:7,title:'Which unit-root tests are in the supplied course materials, and how do they work?',short:'DF / ADF unit-root tests',marks:5,level:'high',area:'Unit roots',prompt:'Describe a unit-root test in detail: regression, null and alternative, statistic, distribution and rejection region. Distinguish DF from ADF.',summary:'The supplied Study Guide and lecture slides explicitly cover the Dickey–Fuller (DF) and Augmented Dickey–Fuller (ADF) tests. The tests use a unit root as the null and a stationary alternative; the DF statistic has a non-standard Dickey–Fuller distribution.',answer:`<h4>Which tests can be verified in the supplied materials?</h4><p>The Study Guide's unit-root chapter and the lecture slides explicitly cover <strong>Dickey–Fuller (DF)</strong> and <strong>Augmented Dickey–Fuller (ADF)</strong>. Phillips–Perron and KPSS were not found in the supplied Subject Guide or lecture pack, so this application does not present them as tests definitely studied in your course.</p><h4>1. Dickey–Fuller (DF)</h4><p>Start from a simple AR(1):</p><div class="formula">Yₜ = α + θYₜ₋₁ + εₜ</div><p>Subtract Yₜ₋₁ and define ψ=θ−1:</p><div class="formula">ΔYₜ = α + ψYₜ₋₁ + εₜ</div><p><strong>Hypotheses:</strong></p><div class="formula">H₀: ψ = 0  (θ=1; unit root; I(1))<br>H₁: ψ &lt; 0  (stationary / I(0), under the specified deterministic terms)</div><p><strong>Statistic:</strong> the DF τ statistic is the usual t-ratio for ψ:</p><div class="formula">τ = ψ̂ / se(ψ̂)</div><p><strong>Distribution:</strong> under H₀ it does <strong>not</strong> have the usual Student-t or N(0,1) distribution. It follows a non-standard Dickey–Fuller distribution. Critical values depend on whether the regression includes no deterministic term, an intercept, or an intercept and trend.</p><p><strong>Rejection region:</strong> this is a left-tailed test. Reject H₀ when τ is more negative than the appropriate DF critical value (τ &lt; cα). In the Guide's intercept specification, the approximate 5% critical value shown is −2.86. Do not use −1.645 / −1.96 from the standard normal distribution.</p><h4>2. Augmented Dickey–Fuller (ADF)</h4><div class="formula">ΔYₜ = α + ψYₜ₋₁ + Σᵢ₌₁ᵖ δᵢΔYₜ₋ᵢ + εₜ</div><p>The null and alternative remain H₀: ψ=0 versus H₁: ψ&lt;0. The test statistic is again the DF-type τ statistic on ψ̂, and the same non-standard DF critical-value logic applies for the selected deterministic specification.</p><p><strong>Why augment?</strong> The basic DF setup assumes the disturbance is white noise. If the change series has higher-order serial correlation, the DF residual may be autocorrelated. Adding lagged differences is intended to absorb that serial correlation so the remaining disturbance is approximately white noise.</p><p><strong>Lag choice trade-off:</strong> too few lags may leave residual autocorrelation and invalidate the test setup; too many lags reduce power. Check sensitivity to the lag length and residual adequacy.</p><h4>Decision and interpretation</h4><p>Compare τ with the correct critical value (or use the p-value from a valid DF/ADF implementation). If τ is sufficiently negative / p&lt;α, reject the unit-root null in favour of stationarity under the deterministic specification. If you fail to reject, say there is insufficient evidence against a unit root; do not say you have proved the series has a unit root.</p>`,rubric:['Write the DF/ADF regression with ΔYₜ and lagged level Yₜ₋₁.','State H₀: ψ=0 (unit root) and H₁: ψ&lt;0 (stationarity alternative).','Give τ=ψ̂/se(ψ̂).','State the non-standard Dickey–Fuller distribution and that critical values depend on deterministic terms.','Give the left-tail rejection rule and explain why ADF adds lagged differences.'],pitfalls:['Using ordinary Student-t / normal critical values.','Using a right-tail rejection region.','Forgetting that deterministic terms alter critical values.','Saying non-rejection proves a unit root.','Not explaining why lagged differences are added in ADF.'],quick:'DF tests ψ=0 in ΔYₜ=α+ψYₜ₋₁+εₜ; τ=ψ̂/se(ψ̂) has non-standard DF critical values and a left-tail rejection region. ADF adds lagged ΔY terms to remove serial correlation in the regression error.',source:'Subject Guide 2026, Chapter 18.4.1–18.4.2; Lecture 4 slides on DF/ADF; past-paper key.'},
{id:8,title:'Why can OLS not be used for general ARMA estimation? What should be used?',short:'Estimating ARMA',marks:5,level:'high',area:'Estimation',prompt:'Explain why OLS is not directly applicable to general ARMA models and discuss the appropriate estimation methods.',summary:'For AR models, lagged dependent variables are observed and OLS can be used. In MA/ARMA, lagged innovations are unobserved and depend on unknown parameters; direct OLS cannot treat them as known regressors. MLE is the general route when the innovation distribution is specified.',answer:`<h4>Why OLS can be used for an AR model</h4><p>In an AR(p), the regressors are lagged observations of Y, which are observed in the sample. The course notes state that OLS can be used for AR models; under stationarity the estimators may be biased in finite samples but are consistent under the stated conditions.</p><h4>Why direct OLS is not available for a general ARMA model</h4><p>An ARMA(p,q) contains lagged innovations:</p><div class="formula">Yₜ = c + Σᵢ₌₁ᵖ φᵢYₜ₋ᵢ + εₜ + Σⱼ₌₁ᵠ θⱼεₜ₋ⱼ</div><p>The εₜ₋ⱼ terms are not observed regressors. They are innovations / residuals that must be inferred, and their values depend on unknown model parameters. Therefore one cannot simply apply OLS treating all right-hand-side variables as observed.</p><h4>What should be used?</h4><p><strong>Maximum likelihood estimation (MLE)</strong> is the general method described in the lectures for MA and ARMA models: for each candidate parameter vector, construct the implied innovations and likelihood, then choose the parameters that maximise the likelihood. This requires a specified innovation distribution (or a likelihood specification).</p><p><strong>Question-specific alternative in the past-paper key:</strong> for the particular ARMA(1,1) question, the marking key also accepts the method of moments: write the Yule–Walker / moment equations, replace population moments with sample moments and solve for the parameters. Another stated alternative is to rewrite the model as AR(∞) and maximise its likelihood if the innovation distribution is known.</p><div class="callout warn"><strong>Precise phrasing matters:</strong> say “OLS cannot be applied directly to the general ARMA equation because lagged innovations are unobserved.” Do not claim that no estimation approach involving least squares or residual optimisation can ever be used in any ARMA implementation.</div>`,rubric:['Distinguish the observed lagged Y regressors in AR from the unobserved lagged innovations in MA/ARMA.','Explain why εₜ₋ⱼ depends on unknown parameters / is not directly observed.','State OLS is available for AR models under course conditions.','Name MLE as the general MA/ARMA method when an innovation distribution is specified.','Mention method-of-moments / Yule–Walker only as the accepted specific ARMA(1,1) past-paper alternative, if relevant.'],pitfalls:['Saying OLS can never be used for an AR model.','Saying all MA/ARMA estimation is necessarily MLE only; the key accepts a specific method-of-moments alternative.','Treating estimated residuals as observed regressors independent of the unknown parameters.'],quick:'AR regressors are observed lags of Y, so OLS can be used. General MA/ARMA contains unobserved lagged innovations; MLE is the standard course method, while the specified ARMA(1,1) key also accepts Yule–Walker method of moments.',source:'Lecture 3 estimation slides; past-paper question and official marking key, ARMA estimation part.'},
{id:9,title:'How do you derive the ACF using Yule–Walker equations?',short:'Yule–Walker ACF',marks:5,level:'high',area:'ACF / PACF',prompt:'Derive the Yule–Walker equations and use them to calculate the ACF for an AR(2).',summary:'Centre the AR process, multiply by lagged values, take expectations, use the innovation’s zero covariance with the past, exploit autocovariance symmetry, then divide by γ₀.',answer:`<h4>1. Centre an AR(p)</h4><div class="formula">Xₜ = Yₜ−μ = φ₁Xₜ₋₁ + … + φₚXₜ₋ₚ + εₜ</div><p>Assume the process is covariance stationary and εₜ is white noise with variance σ²ε and uncorrelated with past Y.</p><h4>2. Derive the autocovariance recursions</h4><p>Define γ(k)=Cov(Xₜ,Xₜ₋ₖ). For k≥1, multiply the AR equation by Xₜ₋ₖ and take expectations. Since εₜ is uncorrelated with past X:</p><div class="formula">γ(k) = φ₁γ(k−1)+…+φₚγ(k−p), &nbsp; k≥1</div><p>At lag zero, the current innovation contributes its variance:</p><div class="formula">γ(0)=φ₁γ(1)+…+φₚγ(p)+σ²ε</div><p>Use symmetry γ(−k)=γ(k).</p><h4>3. Convert to autocorrelations</h4><div class="formula">ρ(k)=γ(k)/γ(0), &nbsp; ρ(0)=1, &nbsp; ρ(−k)=ρ(k)</div><h4>4. Useful AR(2) special case</h4><p>For Xₜ=φ₁Xₜ₋₁+φ₂Xₜ₋₂+εₜ:</p><div class="formula">ρ₁ = φ₁/(1−φ₂)<br>ρₖ = φ₁ρₖ₋₁ + φ₂ρₖ₋₂, &nbsp; k≥2</div><p><strong>Worked example from the past-paper solution:</strong> Xₜ=1.2Xₜ₋₁−0.35Xₜ₋₂+εₜ.</p><div class="formula">ρ₁ = 1.2/(1−(−0.35)) = 1.2/1.35 ≈ 0.8889<br>ρ₂ = 1.2(0.8889)−0.35(1) ≈ 0.7167<br>ρₖ = 1.2ρₖ₋₁−0.35ρₖ₋₂, k≥2</div><p>Continue recursively to obtain further lags and sketch the correlogram. For a stationary AR(2), the ACF tails off; its shape depends on the characteristic roots.</p><div class="callout warn"><strong>Source correction:</strong> one line in the supplied marking key appears to write ρ(s)=γ(1)/γ(s). The correct definition, also used in the Study Guide, is ρ(s)=γ(s)/γ(0). The subsequent numerical Yule–Walker calculations are consistent with the standard definition.</div>`,rubric:['Centre the AR process and state assumptions.','Define γ(k) and ρ(k).','Derive the lag-k Yule–Walker recursion using Cov(εₜ,Xₜ₋ₖ)=0 for k≥1.','Give the lag-zero equation and autocovariance symmetry.','For AR(2), obtain ρ₁ and the recursion; calculate correctly for a numerical example.'],pitfalls:['Using γ(1)/γ(s) instead of γ(s)/γ(0).','Forgetting ρ(0)=1.','Using σ²ε in the positive-lag Yule–Walker recursion.','Forgetting to centre the process when using covariance arguments.','Using the AR(2) recurrence at k=1 without the separate first-lag equation.'],quick:'For AR(p), γ(k)=Σφᵢγ(k−i) for k≥1; divide by γ₀ for ρ(k). For AR(2): ρ₁=φ₁/(1−φ₂) and ρₖ=φ₁ρₖ₋₁+φ₂ρₖ₋₂.',source:'Subject Guide 2026, Chapter 4.3 and AR(1)/AR(2) ACF examples; past-paper AR(2) Yule–Walker worked key.'},
{id:10,title:'What ACF/PACF questions can appear, and how do you solve them?',short:'ACF / PACF exam patterns',marks:5,level:'high',area:'ACF / PACF',prompt:'Identify likely ACF/PACF tasks and explain how to solve each type.',summary:'Know the definitions, theoretical cut-off/tail-off patterns, calculate AR(1)/AR(2) correlations, infer candidate orders from correlograms and sketch the expected decay.',answer:`<h4>Core definitions</h4><p><strong>ACF:</strong> correlation between Yₜ and Yₜ₋ₖ, i.e. ρ(k)=Corr(Yₜ,Yₜ₋ₖ). It includes both direct and indirect lagged association.</p><p><strong>PACF:</strong> the direct association between Yₜ and Yₜ₋ₖ after controlling for the intermediate lags 1,…,k−1.</p><h4>Theoretical patterns to know</h4><table><thead><tr><th>Process</th><th>ACF</th><th>PACF</th><th>Identification clue</th></tr></thead><tbody><tr><td>White noise</td><td>Zero after lag 0</td><td>Zero after lag 0</td><td>No serial correlation</td></tr><tr><td>AR(p)</td><td>Tails off (may decay / oscillate)</td><td>Cuts off after p</td><td>PACF cutoff suggests p</td></tr><tr><td>MA(q)</td><td>Cuts off after q</td><td>Tails off</td><td>ACF cutoff suggests q</td></tr><tr><td>ARMA(p,q)</td><td>Generally tails off</td><td>Generally tails off</td><td>Use both patterns; identify candidate models</td></tr></tbody></table><h4>Likely exam task 1: state AR(1) ACF and PACF</h4><p>For stationary AR(1), Yₜ=c+φYₜ₋₁+εₜ, |φ|&lt;1:</p><div class="formula">ρ(k)=φᵏ, k≥0<br>PACF(1)=φ; PACF(k)=0 for k≥2</div><p>If φ is negative, the ACF alternates sign; if |φ| is close to one, it decays slowly.</p><h4>Likely exam task 2: derive AR(2) ACF</h4><p>Use Yule–Walker:</p><div class="formula">ρ₁=φ₁/(1−φ₂)<br>ρₖ=φ₁ρₖ₋₁+φ₂ρₖ₋₂, k≥2</div><p>Calculate ρ₁, then use ρ₀=1 to calculate ρ₂ and continue recursively. Sketch only after obtaining the sign and decay pattern.</p><h4>Likely exam task 3: identify a model from a correlogram</h4><p>First check whether the series is plausibly stationary. Then look for a clear ACF cutoff (MA), a clear PACF cutoff (AR), or tailing-off in both (ARMA). Treat this as <strong>candidate identification</strong>, not final proof. Estimate candidate models and perform residual diagnostics.</p><h4>Likely exam task 4: compare levels and differences</h4><p>A unit-root level series can have a very persistent ACF. After differencing, if it becomes stationary, the correlogram should be interpreted for the differenced series, not the original levels. State what variable the correlogram belongs to.</p><div class="callout"><strong>Sketching rule:</strong> always start at ρ(0)=1; include zero-lag correctly; show cutoff or decay at the correct lags; alternating signs require a negative / oscillatory pattern rather than a monotonic positive decay.</div>`,rubric:['Define ACF and PACF accurately.','State WN, AR(p), MA(q) and ARMA pattern distinctions.','Give the stationary AR(1) ACF and PACF.','Explain the AR(2) Yule–Walker recurrence.','Explain how correlogram patterns identify candidate models and why diagnostics are still required.'],pitfalls:['Saying PACF of AR(1) tails off; it cuts off after lag 1.','Saying MA(q) ACF tails off; it cuts off after q.','Forgetting the zero-lag ACF is 1.','Treating sample correlograms as conclusive proof of an order.','Sketching the original non-stationary level series as if it were the differenced stationary series.'],quick:'AR(p): PACF cuts off at p; ACF tails off. MA(q): ACF cuts off at q; PACF tails off. ARMA: both generally tail off. Correlograms suggest candidates; estimate and diagnose before selecting.',source:'Subject Guide 2026, Chapter 4; Lecture 2 correlogram slides; past-paper AR(1) PACF and AR(2) ACF questions.'}
];
const theory=[
{id:'dm',title:'Diebold–Mariano test',group:'Forecast evaluation',brief:'Compares the expected loss of two competing forecasts. The test asks whether the average loss differential is zero.',detail:`<h4>Set-up</h4><p>For forecasts A and B, define their losses ℓᴬₜ=L(Yₜ,Ŷᴬₜ) and ℓᴮₜ=L(Yₜ,Ŷᴮₜ). Define dₜ=ℓᴬₜ−ℓᴮₜ.</p><div class="formula">H₀: E(dₜ)=0<br>H₁: E(dₜ)≠0</div><p>Under the serial-independence assumption used in the Guide's numerical activity:</p><div class="formula">DM = √T · d̄ / ŝd  →  N(0,1)</div><p>At 5% for a two-sided test, reject when |DM|&gt;1.96 (equivalently p&lt;.05). For serially correlated loss differentials, the variance of d̄ must account for the long-run variance rather than treating observations as independent.</p><h4>Direction</h4><p>If d̄&lt;0, A has lower average loss and is better under the selected loss. If d̄&gt;0, B has lower average loss. Significance and direction are separate: the sign identifies the apparent winner; the test determines whether the difference is statistically distinguishable from zero.</p><div class="callout warn">Always define dₜ=loss A minus loss B before interpreting the sign. Reverse the definition and the direction reverses.</div>`,steps:['Choose a loss function and calculate each forecast’s loss at each date.','Construct dₜ = ℓᴬₜ−ℓᴮₜ.','Calculate the sample mean d̄ and the standard error of d̄ (using an appropriate variance assumption).','Compute the DM statistic and state H₀/H₁.','Compare with the critical value / p-value; reject or fail to reject.','If significant, use the sign of d̄ to identify which forecast has lower expected loss.'],pitfall:'A non-significant DM statistic does not prove the forecasts are identical; it means the sample does not establish a difference at the chosen significance level.'},
{id:'mz',title:'Mincer–Zarnowitz optimality regression',group:'Forecast evaluation',brief:'Tests calibration / optimality implications by regressing realised values on the forecast.',detail:`<div class="formula">Yₜ₊₁ = β₀ + β₁Ŷₜ₊₁|ₜ + uₜ₊₁</div><p>Under the MZ null, the intercept is zero and the slope is one:</p><div class="formula">H₀: β₀=0 and β₁=1<br>H₁: β₀≠0 or β₁≠1</div><p>Test the two restrictions jointly (for example, a Wald / F / χ² joint restriction test, depending on the regression framework and reported statistic). If p&lt;α, reject forecast optimality in this calibration sense. If p≥α, fail to reject; this is not proof that the forecast is optimal.</p><p>The Guide's worked example highlights a subtlety: a forecast may not be rejected as sub-optimal even when its R² is very low. Low explanatory power does not by itself imply MZ sub-optimality.</p>`,steps:['Regress the realised target on a constant and the forecast.','State H₀: β₀=0, β₁=1.','State H₁: at least one restriction is false.','Use a joint test of both restrictions.','Compare the p-value with α and report the decision.','Interpret non-rejection cautiously; do not use R² alone as the optimality criterion.'],pitfall:'Do not test only whether β₁=1 and forget β₀=0. The standard MZ restriction is joint.'},
{id:'error-test',title:'Regression tests of forecast optimality',group:'Forecast evaluation',brief:'Use the implications that optimal forecast errors should not have a predictable mean or be forecastable from information already available.',detail:`<p>For one-step errors, the Guide proposes:</p><div class="formula">eₜ₊₁|ₜ = α₀ + α₁eₜ|ₜ₋₁ + uₜ₊₁<br>H₀: α₀=α₁=0</div><p>An augmented version can add variables xᵢₜ in the time-t information set. Under optimality, those variables should not help predict the next forecast error:</p><div class="formula">eₜ₊₁|ₜ = α₀ + α₁eₜ|ₜ₋₁ + Σᵢ βᵢxᵢₜ + uₜ₊₁<br>H₀: α₀=α₁=β₁=…=βₖ=0</div><p>Rejecting the joint null gives evidence against optimality. The logic is economic as well as statistical: if an information variable predicts the forecast error, the forecast has failed to exploit information already available.</p>`,steps:['Construct one-step forecast errors.','Regress current forecast error on a constant and lagged forecast error.','Optionally include variables in the information set available at t.','Test all coefficients jointly equal to zero.','Rejecting implies some predictable component remains and the forecast can be improved.'],pitfall:'Do not include information that was unavailable at the forecast origin; that would not test the relevant information set.'},
{id:'ljung',title:'Ljung–Box residual diagnostic',group:'ARMA modelling',brief:'A portmanteau test for whether autocorrelation remains in a series or fitted-model residuals up to a chosen lag m.',detail:`<div class="formula">Q(m)=T(T+2) Σⱼ₌₁ᵐ [ r̂ⱼ²/(T−j) ]</div><p>For a fitted ARMA model, the course's past-paper marking key explicitly reminds students to adjust the asymptotic reference distribution for the number of estimated ARMA parameters. The common fitted-model approximation is χ² with degrees of freedom adjusted by the number of estimated AR and MA coefficients (and any course/software convention for the constant). Follow the convention specified in the question.</p><div class="formula">H₀: ρ(1)=…=ρ(m)=0<br>H₁: at least one autocorrelation through m is non-zero</div><p>A small p-value means reject no autocorrelation: residual serial dependence remains. A large p-value means fail to reject the null; it is evidence that residual autocorrelation is not detected at those lags, not proof of perfect specification.</p>`,steps:['Choose the maximum lag m (often reported at more than one value).','Calculate sample residual autocorrelations r̂₁,…,r̂ₘ.','Compute Q(m).','Use the correct χ² degrees of freedom / fitted-parameter adjustment.','Read the p-value and compare with α.','Conclude whether residual autocorrelation remains and whether the candidate passes this diagnostic.'],pitfall:'Do not interpret “fail to reject no autocorrelation” as proof that every aspect of the model is correct; it diagnoses linear autocorrelation only.'},
{id:'box',title:'Box–Jenkins ARMA workflow',group:'ARMA modelling',brief:'Identification → estimation → diagnostic checking. This is iterative, not a one-way recipe.',detail:`<p><strong>Identification:</strong> plot the series, check stationarity, inspect ACF/PACF, and propose candidate p and q. <strong>Estimation:</strong> estimate parameters. <strong>Diagnostics:</strong> inspect residual dependence, heteroskedasticity and structural change; compare information criteria and select a parsimonious adequate model.</p><p>The lecture's estimation point is examinable: OLS may be used for AR models; MA/ARMA models require a different treatment because the innovations are unobserved, with MLE used in the course's general presentation.</p>`,steps:['Check the series plot and stationarity.','Inspect sample ACF/PACF; propose candidate ARMA orders.','Estimate candidate specifications.','Check residual correlograms and Ljung–Box; investigate heteroskedasticity / structural change.','Compare AIC/BIC on a comparable sample.','Choose an adequate parsimonious model; revise and repeat if diagnostics fail.'],pitfall:'AIC/BIC ranking does not replace diagnostic checking.'},
{id:'df',title:'DF and ADF unit-root testing',group:'Stationarity',brief:'A left-tailed test of the unit-root null using a non-standard Dickey–Fuller distribution.',detail:`<p>DF: begin with ΔYₜ=α+ψYₜ₋₁+εₜ, ψ=θ−1. H₀:ψ=0 (unit root); H₁:ψ&lt;0 (stationarity under the deterministic specification). τ=ψ̂/se(ψ̂), but under H₀ its distribution is non-standard; use DF critical values, not ordinary Student-t or normal values.</p><p>ADF augments the regression with lagged differences ΔYₜ₋ᵢ to remove serial correlation in the disturbance. The null, alternative, and DF-type critical-value logic remain the same. The selected constant / trend specification changes the critical values.</p>`,steps:['Choose deterministic terms based on the test specification.','Estimate the DF or ADF regression.','Test H₀:ψ=0 against H₁:ψ&lt;0.','Calculate τ=ψ̂/se(ψ̂).','Use the matching Dickey–Fuller critical value / p-value (left tail).','Reject or fail to reject and state the conclusion cautiously.'],pitfall:'A value of −2.1 may be significant under a standard normal critical value but not under the DF distribution. Use the unit-root critical values.'},
{id:'yw',title:'Yule–Walker ACF derivation',group:'ACF / PACF',brief:'Derive autocovariances from an AR model using covariance stationarity and the fact that current innovations are uncorrelated with the past.',detail:`<div class="formula">Xₜ=Σᵢ₌₁ᵖφᵢXₜ₋ᵢ+εₜ<br>γ(k)=Σᵢ₌₁ᵖφᵢγ(k−i), k≥1<br>γ(0)=Σᵢ₌₁ᵖφᵢγ(i)+σ²ε</div><p>Use γ(−k)=γ(k), then divide by γ₀: ρ(k)=γ(k)/γ₀. For AR(2), ρ₁=φ₁/(1−φ₂) and ρₖ=φ₁ρₖ₋₁+φ₂ρₖ₋₂ for k≥2.</p>`,steps:['Subtract the unconditional mean.','Write the AR equation for the centred process.','Multiply by the lagged variable and take expectations.','Use Cov(εₜ,Xₜ₋ₖ)=0 for k≥1 and covariance symmetry.','Divide by γ₀ to obtain ρ(k), then use ρ₀=1.','Calculate requested lags and sketch the pattern.'],pitfall:'The correct normalisation is ρ(k)=γ(k)/γ(0), not γ(1)/γ(k).'},
{id:'dm',title:'Forecast comparison and DM decision',group:'Forecast evaluation',brief:'A test of whether competing forecasts have equal expected loss. A sign alone does not establish significance.',detail:`<p>Define dₜ=ℓᴬₜ−ℓᴮₜ. H₀:E(dₜ)=0 versus H₁:E(dₜ)≠0. Under serial independence, DM=√T d̄/ŝd is asymptotically standard normal. At 5%, compare with ±1.96. d̄&lt;0 favours A; d̄&gt;0 favours B, provided the difference is significant.</p>`,steps:['Define loss for each forecast.','Set dₜ=loss A−loss B.','Find d̄ and its standard error.','Calculate DM and state the asymptotic reference distribution under the given assumption.','Compare with the two-sided critical values.','Interpret significance and sign separately.'],pitfall:'Do not declare a winner from a small MSE difference alone; DM assesses whether the difference is significant.'}
];
const flashcards=[
['Define forecast encompassing.','A encompasses B when A contains all predictive information used by B, and possibly more. Test via a regression of the realised value on both forecasts and two joint restrictions.','Forecast comparison'],
['State the two encompassing null hypotheses.','For A: H₀ᴬ: β₁=1, β₂=0. For B: H₀ᴮ: β₁=0, β₂=1 in Y=β₁Ŷᴬ+β₂Ŷᴮ+u.','Forecast comparison'],
['What does failure to reject the A-encompasses-B null imply?','The data are consistent with A encompassing B. It is not proof; precision and power matter.','Forecast comparison'],
['What is the combined forecast error?','eᶜ=ωe₁+(1−ω)e₂ for Ŷᶜ=ωŶ₁+(1−ω)Ŷ₂.','Forecast combination'],
['Write the MSE of a convex combination of correlated unbiased forecasts.','ω²σ₁²+(1−ω)²σ₂²+2ω(1−ω)ρσ₁σ₂.','Forecast combination'],
['What is the MSE-optimal weight on forecast 1?','ω*=(σ₂²−ρσ₁σ₂)/(σ₁²+σ₂²−2ρσ₁σ₂).','Forecast combination'],
['If both forecasts have equal error variance, what are the optimal weights and combined MSE?','ω*=1/2; MSEᶜ=½σ²(1+ρ).','Forecast combination'],
['In-sample vs out-of-sample forecasting?','In-sample predictions refer to observations used to estimate parameters. Out-of-sample forecasts are evaluated on later holdout observations not used for fitting, using only information available at the forecast origin.','Forecast evaluation'],
['How do you obtain a causal MA(∞) representation?','Invert the AR polynomial: Y−μ=[θ(L)/φ(L)]ε=Σψⱼεₜ₋ⱼ. Requires causality / AR roots outside the unit circle.','ARMA representations'],
['How do you obtain an invertible AR(∞) representation?','Invert the MA polynomial: ε=[φ(L)/θ(L)](Y−μ), then rearrange as an infinite autoregression. Requires invertibility / MA roots outside the unit circle.','ARMA representations'],
['Under MSE loss, what is the optimal point forecast?','The conditional mean Eₜ(Yₜ₊ₕ).','Forecast optimality'],
['Under absolute-error loss, what is the optimal point forecast?','The conditional median.','Forecast optimality'],
['Name the four MSE optimal-forecast error properties in the SG / marking key.','Unbiased; h-step errors have zero autocorrelation at lags ≥h (one-step errors are WN); forecast-error variance non-decreasing in h and converges to unconditional variance; h-step error is at most MA(h−1).','Forecast optimality'],
['State the standard Mincer–Zarnowitz regression and null.','Yₜ₊₁=β₀+β₁Ŷₜ₊₁|ₜ+uₜ₊₁; H₀:β₀=0 and β₁=1 (joint).','Forecast optimality'],
['What are the three Box–Jenkins stages?','Identification, estimation, diagnostic checking. Iterate if residual checks reveal inadequacy.','ARMA modelling'],
['Which plots help identify ARMA orders?','Time-series plot, sample ACF and PACF, after checking stationarity.','ARMA modelling'],
['What is the DF regression after reparameterisation?','ΔYₜ=α+ψYₜ₋₁+εₜ, where ψ=θ−1.','Unit roots'],
['What are the DF hypotheses?','H₀:ψ=0 (unit root); H₁:ψ<0 (stationary alternative under the deterministic specification).','Unit roots'],
['What is the DF statistic and its null distribution?','τ=ψ̂/se(ψ̂). Under H₀ it has a non-standard Dickey–Fuller distribution, not ordinary Student-t / N(0,1).','Unit roots'],
['Why does ADF include lagged differences?','To absorb higher-order serial correlation so the regression disturbance is approximately white noise. Too few lags leave autocorrelation; too many reduce power.','Unit roots'],
['Why is the DF rejection region left-tailed?','The stationary alternative is ψ<0; reject the unit-root null for sufficiently negative τ, below the matching DF critical value.','Unit roots'],
['Why can OLS estimate an AR model but not directly a general MA/ARMA model?','AR regressors are observed lagged Y. MA/ARMA includes lagged innovations that are unobserved and depend on unknown parameters.','Estimation'],
['What is the general estimation method for MA / ARMA in the lecture?','Maximum likelihood estimation, when a distribution for the innovations is specified.','Estimation'],
['What question-specific alternative method does the ARMA(1,1) marking key accept?','Method of moments using Yule–Walker equations, replacing population moments with sample moments.','Estimation'],
['State the AR(p) Yule–Walker relation for k≥1.','γ(k)=Σᵢ₌₁ᵖ φᵢγ(k−i), using Cov(εₜ,Xₜ₋ₖ)=0 for k≥1.','ACF / PACF'],
['How is autocorrelation obtained from autocovariance?','ρ(k)=γ(k)/γ(0); ρ(0)=1 and γ(−k)=γ(k).','ACF / PACF'],
['What is the AR(2) Yule–Walker ACF formula?','ρ₁=φ₁/(1−φ₂); ρₖ=φ₁ρₖ₋₁+φ₂ρₖ₋₂ for k≥2.','ACF / PACF'],
['What is the ACF/PACF pattern for AR(p)?','ACF tails off; PACF cuts off after p.','ACF / PACF'],
['What is the ACF/PACF pattern for MA(q)?','ACF cuts off after q; PACF tails off.','ACF / PACF'],
['What is the ACF/PACF pattern for ARMA(p,q)?','Both ACF and PACF generally tail off.','ACF / PACF'],
['What does a negative AR(1) coefficient do to the ACF?','It alternates in sign, with magnitude decaying if |φ|<1.','ACF / PACF'],
['What is the Ljung–Box null hypothesis?','H₀: ρ(1)=…=ρ(m)=0; a small p-value indicates remaining autocorrelation.','Diagnostics'],
['What is the difference between AIC/BIC and residual diagnostics?','AIC/BIC compare candidate models while penalising complexity; residual diagnostics check whether the fitted model has left systematic structure unexplained. Both matter.','Diagnostics'],
['What does a non-rejection in a unit-root test mean?','Insufficient evidence to reject the unit-root null under the chosen deterministic specification; it does not prove a unit root.','Unit roots'],
['Why is stationarity checked before fitting ARMA models?','Non-stationarity affects persistence and standard inference; levels can create spurious regression and invalidate usual asymptotics.','Stationarity'],
['What is the meaning of a high R² in-sample?','It describes in-sample fit, not necessarily out-of-sample predictive performance; additional parameters can overfit.','Forecast evaluation']
].map((x,i)=>({id:i+1,front:x[0],back:x[1],topic:x[2]}));

const procedures=[
{id:'pbox',title:'Box–Jenkins procedure',purpose:'Specify, estimate and diagnose a parsimonious ARMA model.',steps:['Identification: plot, stationarity, ACF/PACF and candidate p/q.','Estimation: estimate the candidate model parameters.','Diagnostic checking: inspect residual dependence, heteroskedasticity and structural change; compare AIC/BIC.','If diagnostics reveal problems, revise the model and repeat.'],why:'The order is logical: do not estimate a model before deciding whether the series is stationary and what dynamics are plausible; do not accept a fitted model before checking its residuals.',distractors:['Estimate every possible high-order ARMA model first.','Choose the model solely by the highest R².','Treat residual checking as optional after AIC/BIC.']},
{id:'pdf',title:'Dickey–Fuller test',purpose:'Test a unit-root null in a simple AR(1)-type setting.',steps:['Write the AR(1) model and reparameterise it as ΔYₜ=α+ψYₜ₋₁+εₜ.','State H₀:ψ=0 (unit root) and H₁:ψ<0 (stationary alternative).','Compute τ=ψ̂/se(ψ̂).','Use the non-standard Dickey–Fuller distribution and the critical values matching deterministic terms.','Reject in the left tail if τ is more negative than the critical value; otherwise fail to reject.','Interpret the conclusion without treating non-rejection as proof.'],why:'The lagged level coefficient is the parameter that distinguishes a unit root from mean-reverting stationarity. Its null distribution is non-standard because under the null the lagged level is a non-stationary random walk.',distractors:['Use t critical values from the ordinary Student distribution.','Reject for a sufficiently positive statistic.','Use a unit-root null of ψ=1 in the differenced regression.']},
{id:'padf',title:'Augmented Dickey–Fuller test',purpose:'Address serial correlation in the simple DF regression disturbance.',steps:['Choose deterministic terms (none, intercept, or intercept plus trend).','Estimate ΔYₜ=α+ψYₜ₋₁+ΣδᵢΔYₜ₋ᵢ+εₜ.','Test H₀:ψ=0 against H₁:ψ<0.','Use the DF-type τ statistic on ψ̂ and the matching non-standard critical values.','Choose enough lagged differences to remove residual autocorrelation.','Check sensitivity: too few lags risk autocorrelation; too many reduce power.'],why:'Adding lagged differences is intended to make the remaining disturbance white noise. If it is still serially correlated, the test regression does not meet the assumptions needed for the unit-root test procedure.',distractors:['Add lags of Y only, not lagged differences.','Use a two-sided standard-normal test.','Choose as many lags as possible because more lags always improve power.']},
{id:'penc',title:'Forecast encompassing test',purpose:'Assess whether one forecast contains the predictive information in another.',steps:['Estimate Yₜ₊₁=β₁Ŷᴬₜ₊₁+β₂Ŷᴮₜ₊₁+uₜ₊₁.','Test H₀ᴬ:β₁=1 and β₂=0 jointly.','Test H₀ᴮ:β₁=0 and β₂=1 jointly.','Interpret each p-value: non-rejection of A’s null is consistent with A encompassing B; likewise for B.','If both nulls are rejected, neither encompasses the other; consider forecast combination.'],why:'The coefficient restrictions ask whether the second forecast adds information after the first is included. These are joint hypotheses because both coefficient restrictions define the encompassing claim.',distractors:['Run two separate tests of β₁=0 and β₂=0 only.','Regress forecast A on forecast B instead of the realised target on both forecasts.','If both hypotheses are not rejected, claim both forecasts are definitely optimal.']},
{id:'pcomb',title:'Optimal two-forecast combination',purpose:'Choose the weight that minimises the combined forecast MSE.',steps:['Define Ŷᶜ=ωŶ¹+(1−ω)Ŷ².','Write eᶜ=ωe₁+(1−ω)e₂.','Expand MSE using σ₁², σ₂² and covariance ρσ₁σ₂.','Differentiate MSE with respect to ω and set the FOC to zero.','Solve for ω* and verify the second derivative is non-negative.','For equal error variances, report ω*=1/2 and MSEᶜ=½σ²(1+ρ).'],why:'The errors are correlated, so the covariance term affects the risk of the combination and therefore the optimal weight.',distractors:['Set ω*=1/2 in every case.','Ignore the covariance term.','Minimise the variance of the forecasts instead of the forecast error.']},
{id:'pyw',title:'Yule–Walker ACF for AR(2)',purpose:'Calculate population autocorrelations from AR coefficients.',steps:['Centre the process: Xₜ=Yₜ−μ.','Write Xₜ=φ₁Xₜ₋₁+φ₂Xₜ₋₂+εₜ.','Use γ(k)=φ₁γ(k−1)+φ₂γ(k−2) for k≥1.','At lag 1, solve ρ₁=φ₁/(1−φ₂).','Set ρ₀=1 and calculate ρ₂, ρ₃, … recursively.','Sketch the correlogram with ρ₀=1 and the appropriate decay / sign pattern.'],why:'At positive lags the current innovation is uncorrelated with the past; dividing by γ₀ removes the scale of the process and gives correlations.',distractors:['Use ρ₁=φ₁+φ₂.','Set ρ₀=0.','Use the lag-zero variance equation as the recursion for every positive lag.']}
];

const mcq=[
{q:'In the encompassing regression Y=β₁Ŷᴬ+β₂Ŷᴮ+u, which null corresponds to A encompassing B?',o:['β₁=0, β₂=1','β₁=1, β₂=0','β₁=β₂=0','β₁=β₂=1'],a:1,why:'A should receive unit weight and B should add no incremental information: β₁=1, β₂=0.'},
{q:'If the average loss differential d̄ = mean(loss A − loss B) is negative, which forecast has lower average loss?',o:['A','B','They are equal by definition','Cannot determine sign'],a:0,why:'Negative d̄ means loss A is smaller on average. The DM statistic still determines whether the difference is significant.'},
{q:'If two forecasts are equally accurate and their errors have correlation ρ, the optimal convex weights are:',o:['Always 0.7 and 0.3','Always 1 and 0','One half each','Proportional to ρ'],a:2,why:'When σ₁=σ₂, the derived optimum is ω*=1/2.'},

const extraTheory=[
{id:'stationary',title:'Stationarity: the diagnostic starting point',group:'Foundations',brief:'Weak stationarity requires constant first two moments and covariance depending only on lag.',detail:`<p>A process {Yₜ} is weakly (covariance) stationary when:</p><div class="formula">E(Yₜ)=μ for all t<br>Var(Yₜ)=σ² for all t<br>Cov(Yₜ,Yₜ₋ₖ)=γ(k), independent of t</div><p>All three are required. A constant variance alone is not enough. Strict stationarity concerns invariance of the full joint distribution; weak stationarity concerns first and second moments. Strict stationarity need not imply weak stationarity if the required moments do not exist; for a Gaussian process, weak stationarity implies strict stationarity.</p><h4>Why test before estimating?</h4><p>Non-stationarity changes persistence and the properties of a time series; standard asymptotic inference may not apply, and regressions involving unrelated persistent variables can be spurious. The Study Guide discusses random-walk/unit-root persistence and spurious regression.</p>`,steps:['Inspect the plot and theoretical context.','Distinguish deterministic trend from stochastic / unit-root trend.','Use DF/ADF test with justified deterministic terms.','If a unit root is not rejected, consider differencing and re-test.','Do not over-difference: difference only as required.'],pitfall:'A series that looks smooth or highly autocorrelated is not automatically proven to contain a unit root.'},
{id:'ar-acf',title:'ACF/PACF pattern recognition',group:'ACF / PACF',brief:'ACF includes direct and indirect correlation; PACF isolates the direct lag-k correlation after controlling for intermediate lags.',detail:`<table><thead><tr><th>Process</th><th>ACF</th><th>PACF</th></tr></thead><tbody><tr><td>WN</td><td>Zero for k&gt;0</td><td>Zero for k&gt;0</td></tr><tr><td>AR(p)</td><td>Tails off</td><td>Cuts off after p</td></tr><tr><td>MA(q)</td><td>Cuts off after q</td><td>Tails off</td></tr><tr><td>ARMA(p,q)</td><td>Generally tails off</td><td>Generally tails off</td></tr></tbody></table><p>Use the theoretical pattern as an identification guide, not as final proof. The sample ACF/PACF helps suggest candidate models; estimate and check residuals afterwards.</p><p>For AR(1), ρ(k)=φᵏ and PACF is φ at lag 1 and zero after lag 1. A negative φ causes alternating signs. Larger |φ| causes slower decay.</p>`,steps:['Confirm the input series is stationary or use the stationary transformation.','Look for an ACF cutoff or tail-off.','Look for a PACF cutoff or tail-off.','Propose one or more candidate structures.','Estimate and run diagnostics; do not stop at the plot.'],pitfall:'An empirical correlogram can be noisy; do not overstate identification as certainty.'},
{id:'arma-est',title:'ARMA estimation and the OLS distinction',group:'Estimation',brief:'The key issue is that MA/ARMA equations contain unobserved past innovations, unlike AR equations whose lagged observations are observed.',detail:`<p>For AR(p), the regressors are observed lagged Y values, so the course permits OLS. For MA(q)/ARMA(p,q), past ε terms are not observed and depend on parameters. Direct OLS is therefore not available by simply treating those terms as known regressors.</p><p>Lecture 3 states that MA and ARMA estimation uses maximum likelihood. In a particular past-paper ARMA(1,1) answer, the marking key also accepts method of moments using Yule–Walker equations. Keep that route as a question-specific acceptable alternative rather than replacing the general lecture method.</p>`,steps:['Identify whether the equation contains lagged Y, lagged ε, or both.','For pure AR, OLS may be used.','For MA/ARMA, note that lagged innovations are unobserved.','Use MLE as the general method stated in lectures.','Use Yule–Walker method of moments where the specific question / key allows it.'],pitfall:'Do not present the method-of-moments route as the universal estimation procedure for all ARMA orders.'},
{id:'aic',title:'AIC/BIC: model choice and parsimony',group:'ARMA modelling',brief:'Information criteria trade fit against model complexity; a lower value is preferred within a comparable candidate set.',detail:`<p>The Guide presents AIC, BIC / SIC and HQIC as goodness-of-fit measures that include a penalty for the number of estimated parameters. Lower values are preferred. Exact displayed formulae can be normalised by T or left unnormalised; do not mix scales across models.</p><div class="formula">AIC = −2 log L + 2k<br>BIC = −2 log L + k log(T)</div><p>Here log L is the maximised log-likelihood, k is the number of estimated parameters, and T is the sample size. (If using the guide's per-observation formula, divide the entire criterion by T consistently.)</p><p>More parameters can improve in-sample fit but also increase estimation error / overfit. AIC/BIC penalise complexity. They do not replace checking residuals for remaining dependence.</p>`,steps:['Estimate candidate models using the same effective sample.','Count estimated parameters consistently.','Calculate AIC/BIC using one formula convention consistently.','Select lower criteria as evidence in favour of that candidate.','Inspect residual diagnostics before accepting the model.'],pitfall:'A lower AIC is not enough if residual diagnostics show the model is inadequate; different criteria may select different candidates.'},
{id:'returns',title:'Financial returns: why use returns rather than price levels?',group:'Financial data',brief:'Asset price levels are often non-stationary; returns are more suitable for many stationary time-series analyses.',detail:`<div class="formula">Simple return: Rₜ=(Pₜ−Pₜ₋₁)/Pₜ₋₁<br>Log return: rₜ=log(Pₜ)−log(Pₜ₋₁)=log(Pₜ/Pₜ₋₁)</div><p>The supplied past-paper solution states that prices of traded assets are generally non-stationary, whereas returns / log-returns are often treated as approximately stationary. Descriptive statistics of price levels can change over time, and regressions involving non-stationary series can be spurious.</p><p>Do not claim that every return series is exactly stationary or normally distributed. Lecture 8 highlights stylised facts: little serial correlation in returns at daily frequencies, non-normal unconditional returns, volatility clustering, leverage effects, mean reversion in volatility, time-varying cross-correlation and long memory in volatility.</p>`,steps:['Start from observed price levels Pₜ.','Construct simple or log returns.','Inspect stationarity empirically rather than assume it.','Model conditional mean and volatility separately if needed.','Interpret return distribution and volatility stylised facts.'],pitfall:'Stationarity of returns does not imply constant conditional variance or normally distributed returns.'},
{id:'garch',title:'ARCH/GARCH and volatility clustering',group:'Financial data',brief:'Financial returns may have little linear autocorrelation while their squared returns / volatility are persistent.',detail:`<p>Write returns as rₜ=μₜ+εₜ and εₜ=σₜzₜ, where zₜ is a standardised shock. An ARCH(1) variance uses a lagged squared shock:</p><div class="formula">σ²ₜ = ω + αε²ₜ₋₁</div><p>A GARCH(1,1) adds lagged conditional variance:</p><div class="formula">σ²ₜ = ω + αε²ₜ₋₁ + βσ²ₜ₋₁</div><p>ARCH/GARCH models capture time-varying conditional volatility / volatility clustering. This is distinct from modelling the conditional mean of returns. The Subject Guide develops GARCH and maximum-likelihood estimation; Lecture 8 introduces the stylised facts and ARCH.</p>`,steps:['Model the conditional mean and obtain innovations εₜ.','Specify a positive conditional variance recursion.','Estimate parameters (the Guide discusses MLE).','Check volatility predictability / adequacy.','Generate conditional variance and risk forecasts.'],pitfall:'A time-varying variance does not itself mean the mean return is predictable.'},
{id:'var',title:'Value-at-Risk: model interpretation',group:'Risk management',brief:'VaR is a quantile-based loss threshold for a specified horizon and confidence level.',detail:`<div class="formula">VaRₜᵅ = −μₜ − σₜ Φ⁻¹(α)</div><p>This is the introductory lecture formula under a conditional normal return assumption and lower-tail probability α. μₜ and σₜ are conditional mean and standard deviation, and Φ⁻¹(α) is the standard-normal quantile. Because Φ⁻¹(α) is negative for a small lower-tail α, the minus sign converts the tail return into a positive loss measure under the lecture's sign convention.</p><p>Do not interpret VaR as the maximum possible loss or as the expected loss beyond the threshold. The full models and backtesting chapters are in the Subject Guide, but the uploaded lecture slides include only the introductory formula and course outline for the later risk lectures.</p>`,steps:['Specify the horizon and tail probability α.','Obtain conditional mean μₜ and volatility σₜ.','Select the conditional innovation distribution.','Compute the corresponding lower-tail quantile.','Convert the return quantile into a loss threshold using the sign convention.','Evaluate forecasts using backtesting if required by the question.'],pitfall:'VaR is a quantile threshold, not an upper bound on losses and not Expected Shortfall.'},
{id:'vargranger',title:'VAR and Granger causality',group:'Multivariate models',brief:'A VAR models several variables jointly; Granger causality asks whether lags of one variable improve prediction of another.',detail:`<p>A bivariate VAR(1) can be written:</p><div class="formula">yₜ=a₁₀+a₁₁yₜ₋₁+a₁₂zₜ₋₁+e₁ₜ<br>zₜ=a₂₀+a₂₁yₜ₋₁+a₂₂zₜ₋₁+e₂ₜ</div><p>y does not Granger-cause z in this simple VAR(1) if the lagged y coefficient in the z equation is zero: H₀:a₂₁=0. In a higher-order VAR, jointly test all lag coefficients of y in the z equation equal zero. Rejection indicates predictive content, not structural causation.</p><p>Lecture 7 also introduces cointegration; the rank of Π in the error-correction representation determines the cointegration structure, and Johansen's test is named as the rank test.</p>`,steps:['Specify the VAR system and lag order.','Identify the equation for the dependent variable being predicted.','State the joint null that all lagged coefficients of the proposed cause equal zero.','Conduct the joint test.','Interpret rejection as incremental predictive content, not causal identification.'],pitfall:'Granger causality means predictive precedence / information content; it does not by itself establish structural causality.'}
];

{id:'white-noise',title:'White noise, IID and innovations',group:'Foundations',brief:'White noise is a zero-mean, constant-variance process with zero autocovariance at non-zero lags; independence is a stronger condition.',detail:`<div class="formula">E(εₜ)=0; Var(εₜ)=σ²; Cov(εₜ,εₜ₋ₖ)=0 for k≠0</div><p>Weak white noise imposes zero serial covariance, not full statistical independence. IID innovations are independent and identically distributed. Independence implies zero covariance when second moments exist, but zero covariance does not generally imply independence.</p><p>In exam questions, check whether independence is stated or whether the problem only supplies white-noise assumptions. Do not silently strengthen the assumption.</p>`,steps:['State the mean condition.','State the constant variance condition.','State zero autocovariance at non-zero lags.','Only claim independence / IID if that assumption is supplied or established.'],pitfall:'Equal marginal probabilities or zero covariance by itself does not establish independence.'},
{id:'roots',title:'Stationarity vs invertibility: root conditions',group:'ARMA modelling',brief:'Stationarity / causality concerns the AR polynomial; invertibility concerns the MA polynomial. They are separate conditions.',detail:`<div class="formula">φ(z)=1−φ₁z−…−φₚzᵖ<br>θ(z)=1+θ₁z+…+θqzq</div><p>Under the standard lag-polynomial convention, stationarity / causality requires roots of φ(z)=0 outside the unit circle. Invertibility requires roots of θ(z)=0 outside the unit circle. If a solution works with inverse roots, they lie inside the circle: these are reciprocal conventions.</p><p>A finite MA(q) is covariance stationary under stationary innovations without restrictions on its MA coefficients; invertibility is a separate question.</p>`,steps:['Write the AR polynomial and solve φ(z)=0.','Check whether every AR root has modulus greater than one for stationarity / causality.','Write the MA polynomial and solve θ(z)=0.','Check whether every MA root has modulus greater than one for invertibility.','State which polynomial and root convention you used.'],pitfall:'Do not apply the MA invertibility condition to stationarity or mix up polynomial roots and inverse characteristic roots.'},
{id:'trends',title:'Trend-stationary vs difference-stationary processes',group:'Stationarity',brief:'A deterministic trend is removed by detrending; a stochastic trend / unit root is removed by differencing.',detail:`<p><strong>Trend-stationary:</strong> Yₜ=α+βt+uₜ, where uₜ is stationary. The mean varies deterministically with t; the appropriate transformation is to remove the deterministic trend.</p><p><strong>Difference-stationary:</strong> a process such as Yₜ=Yₜ₋₁+εₜ contains a stochastic trend. First differencing gives ΔYₜ=εₜ in the simple random-walk case. A shock to a unit-root process has persistent effects on the level.</p><p>Do not automatically difference every trending series. Distinguish the source of non-stationarity and select deterministic terms in the DF/ADF regression accordingly.</p>`,steps:['Inspect the series and economic context.','Consider a deterministic trend specification and a unit-root / stochastic-trend specification.','Use the appropriate DF/ADF deterministic terms.','If the unit-root null is not rejected, consider differencing and re-test.','Avoid unnecessary over-differencing.'],pitfall:'A deterministic trend and a stochastic trend are not the same: they imply different transformations and shock persistence.'}

function renderAcf(){
 $('#view-acf').innerHTML=`<div class="kicker">Quantitative workbench</div><h2>Calculate, classify, interpret</h2><p class="lead">Move beyond recognising a formula. Change the parameter values, calculate the implied ACF, and explain what the correlogram means.</p><div class="grid two"><div class="card"><div class="cardhead"><div><div class="kicker">Yule–Walker calculator</div><h3>AR(2) autocorrelation</h3></div><span class="tag high">Source-style example</span></div><p class="tiny">For a stationary AR(2): ρ₁=φ₁/(1−φ₂), and ρₖ=φ₁ρₖ₋₁+φ₂ρₖ₋₂ for k≥2.</p><div class="grid two"><div class="field"><label for="phi1">φ₁</label><input type="number" id="phi1" step="0.01" value="1.2"></div><div class="field"><label for="phi2">φ₂</label><input type="number" id="phi2" step="0.01" value="-0.35"></div></div><div class="row"><button class="btn primary" onclick="calculateAcf()">Calculate ACF</button><button class="btn" onclick="setAcfExample()">Reset example</button></div><div id="acfResult" style="margin-top:14px"></div></div><div class="card"><div class="kicker">Interpret the correlogram</div><h3>Pattern recognition drill</h3><p class="tiny">Read the model, predict which function cuts off, then check.</p><div class="formula" id="acfPatternPrompt">AR(3) process</div><div class="field"><label>Which description is correct?</label><select id="acfPatternAnswer"><option value="">Choose a pattern…</option><option value="acf-cut">ACF cuts off after lag 3; PACF tails off</option><option value="pacf-cut">PACF cuts off after lag 3; ACF tails off</option><option value="both">Both cut off after lag 3</option><option value="both0">Both are zero at all positive lags (white noise)</option><option value="tails">Both generally tail off</option></select></div><div class="row"><button class="btn primary" onclick="checkAcfPattern()">Check my reasoning</button><button class="btn" onclick="newAcfPattern()">New pattern</button></div><div id="acfPatternFeedback" style="margin-top:10px"></div></div></div><div class="card" style="margin-top:15px"><div class="cardhead"><div><div class="kicker">Visual identification map</div><h3>Know these patterns by heart</h3></div><span class="tag blue">Theoretical patterns</span></div><div class="tablewrap"><table><thead><tr><th>Process</th><th>ACF</th><th>PACF</th><th>What to write</th></tr></thead><tbody><tr><td>White noise</td><td>Zero after lag 0</td><td>Zero after lag 0</td><td>No linear serial dependence.</td></tr><tr><td>AR(p)</td><td>Gradual / possibly oscillatory tail-off</td><td>Cutoff after p</td><td>Use PACF cutoff to suggest p.</td></tr><tr><td>MA(q)</td><td>Cutoff after q</td><td>Gradual tail-off</td><td>Use ACF cutoff to suggest q.</td></tr><tr><td>ARMA(p,q)</td><td>Generally tails off</td><td>Generally tails off</td><td>Use both and compare candidate fits.</td></tr></tbody></table></div><div class="callout warn" style="margin-top:12px">Empirical ACF/PACF plots are identification evidence, not proof of the true order. The Box–Jenkins procedure still requires estimation and residual diagnostics.</div></div><div class="grid two" style="margin-top:15px"><div class="card"><h3>Derivation checklist: Yule–Walker</h3><div class="checklist"><label class="checkrow"><input type="checkbox"> Centre the process around μ.</label><label class="checkrow"><input type="checkbox"> Multiply the AR equation by the lagged process and take expectations.</label><label class="checkrow"><input type="checkbox"> Set covariance of current innovation with the past to zero.</label><label class="checkrow"><input type="checkbox"> Use γ(−k)=γ(k), and divide by γ₀.</label><label class="checkrow"><input type="checkbox"> Set ρ₀=1 and calculate lags recursively.</label></div></div><div class="card"><h3>What might the examiner ask?</h3><ul><li>Define ACF and PACF.</li><li>State the AR(p), MA(q), ARMA patterns.</li><li>Give AR(1) ACF and PACF without derivation.</li><li>Derive AR(2) autocorrelations using Yule–Walker.</li><li>Sketch / interpret correlograms for a process and its differenced version.</li><li>Explain how a negative AR coefficient changes the shape.</li></ul></div></div>`;
