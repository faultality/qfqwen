<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FN3142 Quantitative Finance | Ultimate Prep Studio</title>
    
    <!-- Tailwind CSS for modern, clean UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for beautiful mathematical rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .math-font { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .step-reveal { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .step-hidden { opacity: 0.2; filter: blur(6px); pointer-events: none; transform: translateY(4px); }
        .step-visible { opacity: 1; filter: none; pointer-events: auto; transform: translateY(0); }
        
        .nav-item.active { background-color: #e0e7ff; color: #3730a3; border-right: 4px solid #4338ca; font-weight: 600; }
        
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .trap-card { border-left: 4px solid #ef4444; background-color: #fef2f2; }
        .tip-card { border-left: 4px solid #10b981; background-color: #ecfdf5; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col h-full shadow-sm z-10">
        <div class="p-6 border-b border-slate-100">
            <h1 class="text-xl font-bold text-indigo-900 flex items-center gap-2">
                <i class="fa-solid fa-brain text-indigo-600"></i> FN3142 Mastery
            </h1>
            <p class="text-xs text-slate-500 mt-1">Procedural & Derivation Focus</p>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-1">
                <li><button onclick="switchView('dashboard')" class="nav-item active w-full text-left px-6 py-3 text-sm text-slate-600 hover:bg-slate-50 transition flex items-center gap-3"><i class="fa-solid fa-gauge w-5"></i> Dashboard</button></li>
                <li><button onclick="switchView('procedures')" class="nav-item w-full text-left px-6 py-3 text-sm text-slate-600 hover:bg-slate-50 transition flex items-center gap-3"><i class="fa-solid fa-list-ol w-5"></i> Procedure Builder</button></li>
                <li><button onclick="switchView('derivations')" class="nav-item w-full text-left px-6 py-3 text-sm text-slate-600 hover:bg-slate-50 transition flex items-center gap-3"><i class="fa-solid fa-square-root-variable w-5"></i> Derivation Lab</button></li>
                <li><button onclick="switchView('traps')" class="nav-item w-full text-left px-6 py-3 text-sm text-slate-600 hover:bg-slate-50 transition flex items-center gap-3"><i class="fa-solid fa-triangle-exclamation w-5"></i> Examiner Traps</button></li>
                <li><button onclick="switchView('simulator')" class="nav-item w-full text-left px-6 py-3 text-sm text-slate-600 hover:bg-slate-50 transition flex items-center gap-3"><i class="fa-solid fa-pen-to-square w-5"></i> Exam Simulator</button></li>
                <li><button onclick="switchView('formulas')" class="nav-item w-full text-left px-6 py-3 text-sm text-slate-600 hover:bg-slate-50 transition flex items-center gap-3"><i class="fa-solid fa-book-open w-5"></i> Formula Vault</button></li>
            </ul>
        </nav>

        <div class="p-4 border-t border-slate-100 bg-slate-50">
            <div class="flex justify-between text-xs text-slate-500 mb-1">
                <span>Mastery Progress</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2">
                <div id="progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <button onclick="resetProgress()" class="mt-3 text-xs text-red-500 hover:text-red-700 underline w-full text-center">Reset Local Progress</button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto bg-slate-50 p-8 relative" id="main-content">
        <!-- Content injected via JS -->
    </main>

    <script>
        // --- DATA & CONTENT (Based on ICEF Mocks & Lectures) ---
        const procedures = [
            {
                id: 'dm-test',
                title: 'Diebold-Mariano (DM) Test Procedure',
                examFocus: 'Mock Q: "How can we test that model A is better in forecasting than model B?"',
                steps: [
                    { title: '1. Define the Loss Difference', desc: 'Let $d_t = L(y_t, \\hat{y}^A_t) - L(y_t, \\hat{y}^B_t)$. For MSE loss, $d_t = (e^A_t)^2 - (e^B_t)^2$.' },
                    { title: '2. State the Hypotheses', desc: '$H_0: E[d_t] = 0$ (Forecasts are equally accurate). <br> $H_A: E[d_t] \\neq 0$ (Two-sided) or $E[d_t] < 0$ (Model A is better, since it has lower loss).' },
                    { title: '3. Compute Sample Mean', desc: 'Calculate $\\bar{d} = \\frac{1}{T} \\sum_{t= in-sample}^T d_t$.' },
                    { title: '4. Estimate Variance (HAC)', desc: 'Because $d_t$ is often serially correlated, use the Newey-West estimator: <br> $\\hat{V}[\\bar{d}] = \\frac{1}{T} \\left( \\hat{\\gamma}_0 + 2 \\sum_{j=1}^M (1 - \\frac{j}{M+1}) \\hat{\\gamma}_j \\right)$.' },
                    { title: '5. Calculate Test Statistic', desc: '$DM = \\frac{\\bar{d}}{\\sqrt{\\hat{V}[\\bar{d}]}} \\xrightarrow{d} N(0,1)$ as $T \\to \\infty$.' },
                    { title: '6. Decision Rule & Interpretation', desc: 'If $|DM| > 1.96$ (at 5% level), reject $H_0$. <br><strong>Crucial:</strong> If $DM < -1.96$, Model A has significantly lower loss (is better). If $DM > 1.96$, Model B is better.' }
                ]
            },
            {
                id: 'encompassing',
                title: 'Forecast Encompassing & Combination',
                examFocus: 'Mock Q: "Describe the procedure to find an optimal linear combination of two forecasts."',
                steps: [
                    { title: '1. Set up the Combination Regression', desc: 'Regress the actual realization on both forecasts (add constant $\\beta_0$ if forecasts may be biased): <br> $y_{t+1} = \\beta_0 + \\beta_1 \\hat{y}^A_{t+1} + \\beta_2 \\hat{y}^B_{t+1} + u_{t+1}$' },
                    { title: '2. State Hypothesis for Model A', desc: '$H_0^A: \\beta_1 = 1 \\cap \\beta_2 = 0$. <br> This means Model A contains all useful information; Model B adds nothing.' },
                    { title: '3. State Hypothesis for Model B', desc: '$H_0^B: \\beta_1 = 0 \\cap \\beta_2 = 1$. <br> This means Model B encompasses Model A.' },
                    { title: '4. Conduct Joint F-test / Wald Test', desc: 'Test the linear restrictions. Obtain the p-value. (Do not use individual t-tests for joint hypotheses).' },
                    { title: '5. Interpret the Four Outcomes', desc: '<ul class="list-disc ml-4 mt-1 text-sm"><li>Fail to reject $H_0^A$, Reject $H_0^B$: A encompasses B.</li><li>Reject $H_0^A$, Fail to reject $H_0^B$: B encompasses A.</li><li>Reject both: Neither encompasses the other <strong>→ Combine them!</strong></li><li>Fail to reject both: Both models are likely poor/noisy.</li></ul>' },
                    { title: '6. Optimal Combination (if needed)', desc: 'If combining, the optimal weight minimizing MSE is: <br> $\\omega^* = \\frac{\\sigma_B^2 - \\rho\\sigma_A\\sigma_B}{\\sigma_A^2 + \\sigma_B^2 - 2\\rho\\sigma_A\\sigma_B}$' }
                ]
            },
            {
                id: 'mz-test',
                title: 'Mincer-Zarnowitz (MZ) Test for Optimality',
                examFocus: 'Mock Q: "Describe in detail at least one test for testing for forecast optimality under MSE."',
                steps: [
                    { title: '1. Set up the MZ Regression', desc: 'Regress the realized value on the forecast: <br> $Y_{t+1} = \\beta_0 + \\beta_1 \\hat{Y}_{t+1|t} + u_{t+1}$' },
                    { title: '2. State the Joint Null Hypothesis', desc: '$H_0: \\beta_0 = 0 \\cap \\beta_1 = 1$. <br> (The forecast is unbiased and fully efficient).' },
                    { title: '3. State the Alternative', desc: '$H_A: \\beta_0 \\neq 0 \\cup \\beta_1 \\neq 1$. <br> (At least one restriction fails; the forecast is sub-optimal).' },
                    { title: '4. Conduct the Test', desc: 'Use a joint Wald test or F-test for the two restrictions. <br><em>Note:</em> If residuals are heteroskedastic, use robust standard errors.' },
                    { title: '5. Interpretation', desc: 'If p-value < 0.05, reject $H_0$. Conclude: "There is statistical evidence that the forecast is sub-optimal." <br> If p-value > 0.05, "We fail to reject optimality" (Do NOT say "we accept optimality").' }
                ]
            },
            {
                id: 'adf-test',
                title: 'Augmented Dickey-Fuller (ADF) Test',
                examFocus: 'Mock Q: "Perform the ADF test... Decide which specification to use, write null/alternative, report statistic and conclusion."',
                steps: [
                    { title: '1. Specify the Regression', desc: '$\\Delta Y_t = \\delta + \\gamma Y_{t-1} + \\sum_{i=1}^p \\psi_i \\Delta Y_{t-i} + u_t$. <br> (Include $\\delta$ for drift, and optionally $\\mu t$ for trend, based on visual inspection of the series).' },
                    { title: '2. State Hypotheses', desc: '$H_0: \\gamma = 0$ (Series has a unit root, is I(1)). <br> $H_A: \\gamma < 0$ (Series is stationary, I(0)).' },
                    { title: '3. Calculate Test Statistic', desc: '$t_{\\hat{\\gamma}} = \\frac{\\hat{\\gamma}}{SE(\\hat{\\gamma})}$.' },
                    { title: '4. Critical Values & Decision', desc: '<strong>DO NOT use standard Normal critical values (-1.64).</strong> Use Dickey-Fuller critical values (e.g., approx -2.86 for 5% with constant). <br> If $t_{\\hat{\\gamma}} < \\text{Critical Value}$, reject $H_0$ (Stationary).' },
                    { title: '5. Lag Selection', desc: 'Mention that the number of lags $p$ is chosen to ensure $u_t$ is white noise, typically using AIC/BIC or general-to-specific testing.' }
                ]
            }
        ];

        const derivations = [
            {
                id: 'optimal-combination',
                title: 'Optimal Forecast Combination Weight (MSE)',
                prompt: 'Derive the optimal weight $\\omega^*$ for combining two unbiased forecasts $\\hat{y}^A$ and $\\hat{y}^B$ to minimize MSE.',
                steps: [
                    '1. Define combination forecast: $\\hat{y}^C_t = \\omega \\hat{y}^A_t + (1-\\omega) \\hat{y}^B_t$',
                    '2. Define combination error: $e^C_t = y_t - \\hat{y}^C_t = \\omega e^A_t + (1-\\omega) e^B_t$',
                    '3. Write the MSE of the combination: <br> $E[(e^C_t)^2] = \\omega^2 \\sigma_A^2 + (1-\\omega)^2 \\sigma_B^2 + 2\\omega(1-\\omega)\\rho\\sigma_A\\sigma_B$',
                    '4. First Order Condition (FOC): Differentiate w.r.t $\\omega$ and set to 0: <br> $2\\omega \\sigma_A^2 - 2(1-\\omega)\\sigma_B^2 + 2\\rho\\sigma_A\\sigma_B(1-2\\0) = 0$',
                    '5. Expand and group $\\omega$ terms: <br> $\\omega(\\sigma_A^2 + \\sigma_B^2 - 2\\rho\\sigma_A\\sigma_B) = \\sigma_B^2 - \\rho\\sigma_A\\sigma_B$',
                    '6. Solve for $\\omega^*$: <br> $\\omega^* = \\frac{\\sigma_B^2 - \\rho\\sigma_A\\sigma_B}{\\sigma_A^2 + \\sigma_B^2 - 2\\rho\\sigma_A\\sigma_B}$'
                ]
            },
            {
                id: 'ar1-hstep-var',
                title: 'AR(1) h-step Forecast Error Variance',
                prompt: 'Derive the variance of the h-step ahead forecast error for $Y_t = c + \\phi Y_{t-1} + \\varepsilon_t$.',
                steps: [
                    '1. Write the model for $t+h$ by recursive substitution: <br> $Y_{t+h} = c(1+\\phi+...+\\phi^{h-1}) + \\phi^h Y_t + \\varepsilon_{t+h} + \\phi\\varepsilon_{t+h-1} + ... + \\phi^{h-1}\\varepsilon_{t+1}$',
                    '2. Take conditional expectation $E_t[\\cdot]$: <br> $\\hat{Y}_{t+h|t} = c\\frac{1-\\phi^h}{1-\\phi} + \\phi^h Y_t$ (since $E_t[\\varepsilon_{t+j}] = 0$ for $j>0$)',
                    '3. Define forecast error: $e_{t+h|t} = Y_{t+h} - \\hat{Y}_{t+h|t} = \\varepsilon_{t+h} + \\phi\\varepsilon_{t+h-1} + ... + \\phi^{h-1}\\varepsilon_{t+1}$',
                    '4. Calculate variance (innovations are uncorrelated): <br> $V_t(e_{t+h|t}) = \\sigma^2 + \\phi^2\\sigma^2 + \\phi^4\\sigma^2 + ... + \\phi^{2(h-1)}\\sigma^2$',
                    '5. Sum the geometric series: <br> $V_t(e_{t+h|t}) = \\sigma^2 \\frac{1-\\phi^{2h}}{1-\\phi^2}$'
                ]
            },
            {
                id: 'ma-infinity',
                title: 'Deriving MA(∞) from AR(1)',
                prompt: 'Show how an AR(1) process $Y_t = c + \\phi Y_{t-1} + \\varepsilon_t$ (with $|\\phi| < 1$) can be written as an MA(∞) process.',
                steps: [
                    '1. Rewrite using the Lag Operator $L$: <br> $Y_t - \\phi L Y_t = c + \\varepsilon_t \\implies (1 - \\phi L)Y_t = c + \\varepsilon_t$',
                    '2. Isolate $Y_t$ by multiplying by the inverse operator $(1 - \\phi L)^{-1}$: <br> $Y_t = (1 - \\phi L)^{-1}c + (1 - \\phi L)^{-1}\\varepsilon_t$',
                    '3. Apply the geometric series expansion (valid since $|\\phi| < 1$): <br> $(1 - \\phi L)^{-1} = 1 + \\phi L + \\phi^2 L^2 + \\phi^3 L^3 + ...$',
                    '4. Distribute the expansion: <br> $Y_t = c(1 + \\phi + \\phi^2 + ...) + (\\varepsilon_t + \\phi\\vare {t-1} + \\phi^2\\varepsilon_{t-2} + ...)$',
                    '5. Simplify the constant term (sum of infinite geometric series): <br> $Y_t = \\frac{c}{1-\\phi} + \\sum_{j=0}^{\\infty} \\phi^j \\varepsilon_{t-j}$'
                ]
            }
        ];

        const traps = [
            {
                title: 'Zero Covariance ≠ Independence',
                content: 'Examiners love to give you $Cov(X,Y)=0$ and ask if they are independent. <strong>Answer: No.</strong> Zero covariance only implies no <em>linear</em> relationship. You must provide a counterexample (e.g., $X \\sim N(0,1)$, $Y=X^2$. $Cov(X,X^2)=0$ by symmetry, but they are perfectly dependent).',
                tags: ['Probability', 'Exam Trap']
            },
            {
                title: 'White Noise ≠ Automatically IID',
                content: 'White Noise only requires $E[\\varepsilon_t]=0$, constant variance, and zero autocovariance. It does <strong>not</strong> imply independence or identical distribution unless explicitly stated (e.g., "Gaussian White Noise"). Do not assume $E[\\varepsilon_t^4] = 3\\sigma^4$ unless Normality is given.',
                tags: ['Time Series', 'Definitions']
            },
            {
                title: 'Stationarity ≠ Invertibility',
                content: 'For ARMA(p,q): <br>• <strong>Stationarity</strong> depends ONLY on the AR roots (must lie outside the unit circle for the inverse characteristic equation). <br>• <strong>Invertibility</strong> depends ONLY on the MA roots (must lie outside the unit circle). <br>A finite MA(q) is <em>always</em> stationary, but may not be invertible.',
                tags: ['ARMA', 'Roots']
            },
            {
                title: 'ADF Critical Values are NOT Normal',
                content: 'The Dickey-Fuller test statistic follows a non-standard distribution. The 5% critical value with a constant is approx <strong>-2.86</strong>, not -1.64. If your calculated t-stat is -2.00, you <strong>fail to reject</strong> the unit root null, even though -2.00 < -1.64.',
                tags: ['Unit Root', 'Hypothesis Testing']
            },
            {
                title: 'Diebold-Mariano Sign Convention',
                content: 'If you define $d_t = Loss_A - Loss_B$, then a <strong>negative</strong> $\\bar{d}$ (and thus a negative DM statistic) means Model A has <em>lower</em> loss and is therefore <strong>better</strong>. Always explicitly state your $d_t$ definition to avoid losing marks on interpretation.',
                tags: ['Forecast Evaluation', 'DM Test']
            },
            {
                title: 'Trend-Stationary vs. Difference-Stationary',
                content: 'If a series has a deterministic time trend ($Y_t = \\alpha + \\beta t + \\varepsilon_t$), differencing it ($\\Delta Y_t = \\beta + \\varepsilon_t - \\varepsilon_{t-1}$) makes it stationary but introduces a <strong>non-invertible MA(1)</strong> structure in the errors. The correct procedure is <strong>de-trending</strong> via OLS regression on $t$, not differencing.',
                tags: ['Non-stationarity', 'Modeling']
            }
        ];

        const simulatorChecklist = [
            { id: 'c1', text: 'Identified the model, parameter restrictions, and innovation properties (e.g., $\\varepsilon_t \\sim WN(0, \\sigma^2)$).' },
            { id: 'c2', text: 'Stated the relevant definition or null/alternative hypotheses explicitly (no vague language).' },
            { id: 'c3', text: 'Set up the mathematical expression (did not jump straight to the final formula).' },
            { id: 'c4', text: 'Showed the algebra (explained why cross-products vanish, which shocks are known at time $t$, used LIE if needed).' },
            { id: 'c5', text: 'Boxed or clearly highlighted the final result.' },
            { id: 'c6', text: 'Interpreted the result in the context of the question (e.g., "Since $|\\phi| < 1$, the process is covariance stationary").' },
            { id: 'c7', text: 'Checked for examiner traps (e.g., used correct critical values, didn\'t assume independence without justification).' }
        ];

        // --- STATE MANAGEMENT ---
        let currentView = 'dashboard';
        let progress = JSON.parse(localStorage.getItem('fn3142_progress_v2')) || {
            procedures: {},
            derivations: {},
            simulator: {}
        };

        // --- RENDER FUNCTIONS ---
        function renderMath() {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            const main = document.getElementById('main-content');
            main.innerHTML = '<div class="flex items-center justify-center h-full"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600"></i></div>';
            
            setTimeout(() => {
                if (view === 'dashboard') renderDashboard(main);
                else if (view === 'procedures') renderProcedures(main);
                else if (view === 'derivations') renderDerivations(main);
                else if (view === 'traps') renderTraps(main);
                else if (view === 'simulator') renderSimulator(main);
                else if (view === 'formulas') renderFormulas(main);
                
                renderMath();
                updateProgressBar();
            }, 100);
        }

        function renderDashboard(container) {
            const totalSteps = procedures.reduce((acc, p) => acc + p.steps.length, 0) + derivations.length;
            const completedSteps = Object.values(progress.procedures).reduce((acc, val) => acc + val, 0) + Object.keys(progress.derivations).length;
            const pct = Math.round((completedSteps / totalSteps) * 100);

            container.innerHTML = `
                <div class="fade-in max-w-4xl mx-auto">
                    <h2 class="text-3xl font-bold text-slate-800 mb-2">Welcome back, Quant.</h2>
                    <p class="text-slate-600 mb-8">Your command centre for FN3142. Focus on <strong>procedural mastery</strong> and <strong>active derivation</strong> over rote memorization.</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 hover:border-indigo-200 transition">
                            <div class="text-indigo-600 text-2xl mb-2"><i class="fa-solid fa-list-check"></i></div>
                            <h3 class="font-bold text-lg">Procedure Builder</h3>
                            <p class="text-sm text-slate-500 mt-1">${Object.keys(progress.procedures).length} / ${procedures.length} mastered</p>
                            <button onclick="document.querySelector('button[onclick=\\'switchView(\\'procedures\\')\\']').click()" class="mt-4 text-sm font-medium text-indigo-600 hover:underline">Reconstruct Procedures →</button>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 hover:border-emerald-200 transition">
                            <div class="text-emerald-600 text-2xl mb-2"><i class="fa-solid fa-pen-to-square"></i></div>
                            <h3 class="font-bold text-lg">Derivation Lab</h3>
                            <p class="text-sm text-slate-500 mt-1">${Object.keys(progress.derivations).length} / ${derivations.length} completed</p>
                            <button onclick="document.querySelector('button[onclick=\\'switchView(\\'derivations\\')\\']').click()" class="mt-4 text-sm font-medium text-emerald-600 hover:underline">Practice Derivations →</button>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 hover:border-amber-200 transition">
                            <div class="text-amber-600 text-2xl mb-2"><i class="fa-solid fa-triangle-exclamation"></i></div>
                            <h3 class="font-bold text-lg">Examiner Traps</h3>
                            <p class="text-sm text-slate-500 mt-1">Don't lose easy marks.</p>
                            <ul class="text-xs text-slate-600 mt-3 space-y-1">
                                <li>• Zero covariance $\\neq$ Independence</li>
                                <li>• White noise $\\neq$ IID (unless specified)</li>
                                <li>• Use DF critical values, not Normal!</li>
                            </ul>
                        </div>
                    </div>

                    <div class="bg-indigo-900 text-white p-6 rounded-xl shadow-lg">
                        <h3 class="font-bold text-lg mb-2"><i class="fa-solid fa-lightbulb text-yellow-400 mr-2"></i> ICEF Examiner's Recurring Logic</h3>
                        <p class="text-indigo-100 text-sm leading-relaxed">
                            "Numerical answers without any derivations or explanations won’t be graded." A single ARMA process may generate questions about orders, roots, moments, ACF and forecasts. Small twists matter: watch for trends, unusual information sets, correlated errors, and alternative loss functions. Always finish tests and calculations by explaining what the result means in the question's context.
                        </p>
                    </div>
                </div>
            `;
        }

        function renderProcedures(container) {
            let html = `<div class="fade-in max-w-4xl mx-auto"><h2 class="text-2xl font-bold mb-2">Procedure Builder</h2><p class="text-slate-600 mb-6">Examiners award marks for specific steps. Reconstruct the procedure step-by-step. Do not click "Reveal" until you have mentally outlined the step.</p><div class="space-y-6">`;
            
            procedures.forEach(proc => {
                const isComplete = progress.procedures[proc.id] === proc.steps.length;
                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <div>
                                <h3 class="font-bold text-lg text-slate-800">${proc.title}</h3>
                                <p class="text-xs text-amber-600 font-medium mt-1"><i class="fa-solid fa-star mr-1"></i> ${proc.examFocus}</p>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${isComplete ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">
                                ${progress.procedures[proc.id] || 0} / ${proc.steps.length} Steps
                            </span>
                        </div>
                        <div class="p-5 space-y-4">
                `;
                
                proc.steps.forEach((step, idx) => {
                    const isRevealed = (progress.procedures[proc.id] || 0) > idx;
                    html += `
                        <div class="step-reveal ${isRevealed ? 'step-visible' : 'step-hidden'} bg-slate-50 p-4 rounded-lg border border-slate-200">
                            <h4 class="font-semibold text-indigo-900 mb-1">${step.title}</h4>
                            <p class="text-sm text-slate-700 leading-relaxed">${step.desc}</p>
                        </
</div>
                    `;
                });

                html += `
                        <div class="pt-2">
                            <button onclick="revealStep('${proc.id}', ${proc.steps.length})" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-eye"></i> Reveal Next Step
                            </button>
                        </div>
                    </div></div>
                `;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderDerivations(container) {
            let html = `<div class="fade-in max-w-4xl mx-auto"><h2 class="text-2xl font-bold mb-2">Active Derivation Lab</h2><p class="text-slate-600 mb-6">Don't just read the math. Predict the next step before revealing it. This builds the muscle memory needed for "Show that..." questions.</p><div class="space-y-8">`;
            
            derivations.forEach(deriv => {
                const isDone = progress.derivations[deriv.id];
                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="font-bold text-lg text-slate-800">${deriv.title}</h3>
                            ${isDone ? '<span class="text-emerald-600 text-sm font-bold"><i class="fa-solid fa-check-circle"></i> Completed</span>' : ''}
                        </div>
                        <p class="text-sm text-slate-600 mb-4 italic bg-slate-50 p-3 rounded border-l-4 border-indigo-400">${deriv.prompt}</p>
                        <div class="space-y-3" id="deriv-steps-${deriv.id}">
                `;
                
                deriv.steps.forEach((step, idx) => {
                    html += `
                        <div class="flex gap-3 items-start p-3 rounded hover:bg-slate-50 transition derivation-step" data-idx="${idx}" style="opacity: ${isDone || idx === 0 ? 1 : 0.3}">
                            <div class="mt-1 w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold shrink-0">${idx + 1}</div>
                            <p class="text-sm text-slate-800 math-font leading-relaxed">${step}</p>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                        ${!isDone ? `<button onclick="nextDerivationStep('${deriv.id}', ${deriv.steps.length})" class="mt-4 px-4 py-2 bg-slate-800 text-white text-sm rounded hover:bg-slate-900 transition">Reveal Next Step</button>` : ''}
                    </div>
                `;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderTraps(container) {
            let html = `<div class="fade-in max-w-4xl mx-auto"><h2 class="text-2xl font-bold mb-6">Examiner Traps & Conceptual Distinctions</h2><div class="grid gap-6">`;
            
            traps.forEach(trap => {
                html += `
                    <div class="trap-card bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex gap-2 mb-3">
                            ${trap.tags.map(tag => `<span class="px-2 py-1 bg-red-50 text-red-700 text-xs font-bold rounded">${tag}</span>`).join('')}
                        </div>
                        <h3 class="font-bold text-xl text-slate-800 mb-3">${trap.title}</h3>
                        <div class="text-slate-700 leading-relaxed text-sm">${trap.content}</div>
                    </div>
                `;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderSimulator(container) {
            let html = `
                <div class="fade-in max-w-3xl mx-auto">
                    <h2 class="text-2xl font-bold mb-2">Exam Technique Simulator</h2>
                    <p class="text-slate-600 mb-6">Before submitting any derivation or calculation in the exam, mentally check these boxes. Click to toggle. This is the "Universal Derivation Template" extracted from the mock grading rubrics.</p>
                    
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
            `;
            
            simulatorChecklist.forEach(item => {
                const isChecked = progress.simulator[item.id];
                html += `
                    <label class="flex items-start gap-3 p-3 rounded-lg border ${isChecked ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-slate-50'} cursor-pointer hover:bg-slate-100 transition">
                        <input type="checkbox" class="mt-1 w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500" 
                            ${isChecked ? 'checked' : ''} 
                            onchange="toggleSimulatorCheck('${item.id}')">
                        <span class="text-sm text-slate-800 font-medium">${item.text}</span>
                    </label>
                `;
            });
            
            html += `
                    </div>
                    <div class="mt-6 p-4 bg-amber-50 border border-amber-200 rounded-lg text-amber-800 text-sm">
                        <strong><i class="fa-solid fa-triangle-exclamation mr-1"></i> Pro Tip from Mocks:</strong> "Numerical answers without any derivations or explanations won’t be graded." If a question asks you to "Describe the procedure", you must list the hypotheses, the test statistic formula, the decision rule, AND the economic interpretation. Missing any of these costs 1-2 marks.
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function renderFormulas(container) {
            const formulas = [
                { name: 'AR(1) Unconditional Mean', formula: '\\mu = \\frac{c}{1 - \\phi}', condition: '|\\phi| < 1' },
                { name: 'AR(1) Unconditional Variance', formula: '\\gamma(0) = \\frac{\\sigma^2_\\varepsilon}{1 - \\phi^2}', condition: '|\\phi| < 1' },
                { name: 'AR(1) ACF', formula: '\\rho(h) = \\phi^{|h|}', condition: 'Geometric decay' },
                { name: 'AR(1) h-step Forecast Error Var', formula: 'V_t(e_{t+h|t}) = \\sigma^2 \\frac{1-\\phi^{2h}}{1-\\phi^2}', condition: 'Converges to $\\gamma(0)$ as $h \\to \\infty$' },
                { name: 'MA(q) Variance', formula: '\\gamma(0) = \\sigma^2(1 + \\theta_1^2 + ... + \\theta_q^2)', condition: 'Always stationary' },
                { name: 'GARCH(1,1) Uncond. Variance', formula: '\\bar{\\sigma}^2 = \\frac{\\omega}{1 - \\alpha - \\beta}', condition: '\\alpha + \\beta < 1' },
                { name: 'Mincer-Zarnowitz Regression', formula: 'Y_{t+1} = \\beta_0 + \\beta_1 \\hat{Y}_{t+1|t} + u_{t+1}', condition: 'H_0: \\beta_0 = 0 \\cap \\beta_1 = 1' },
                { name: 'Diebold-Mariano Statistic', formula: 'DM = \\frac{\\bar{d}}{\\sqrt{\\hat{V}[\\bar{d}]}} \\sim N(0,1)', condition: 'H_0: E[d_t] = 0' },
                { name: 'Optimal Combination Weight', formula: '\\omega^* = \\frac{\\sigma_B^2 - \\rho\\sigma_A\\sigma_B}{\\sigma_A^2 + \\sigma_B^2 - 2\\rho\\sigma_A\\sigma_B}', condition: 'Minimizes MSE' },
                { name: 'ADF Test Regression', formula: '\\Delta Y_t = \\delta + \\gamma Y_{t-1} + \\sum \\psi_i \\Delta Y_{t-i} + u_t', condition: 'H_0: \\gamma = 0 (Unit Root)' }
            ];

            let html = `<div class="fade-in max-w-4xl mx-auto"><h2 class="text-2xl font-bold mb-6">Formula Vault</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
            
            formulas.forEach(f => {
                html += `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 hover:border-indigo-300 transition">
                        <h4 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">${f.name}</h4>
                        <div class="text-lg text-indigo-900 math-font mb-3 text-center py-2 bg-slate-50 rounded">$$${f.formula}$$</div>
                        <p class="text-xs text-slate-600 text-right italic"><i class="fa-solid fa-circle-info mr-1"></i> Condition: ${f.condition}</p>
                    </div>
                `;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        // --- INTERACTION LOGIC ---
        function revealStep(procId, totalSteps) {
            if (!progress.procedures[procId]) progress.procedures[procId] = 0;
            if (progress.procedures[procId] < totalSteps) {
                progress.procedures[procId]++;
                saveProgress();
                renderProcedures(document.getElementById('main-content'));
                renderMath();
            }
        }

        function nextDerivationStep(derivId, totalSteps) {
            const steps = document.querySelectorAll(`#deriv-steps-${derivId} .derivation-step`);
            let nextHidden = -1;
            steps.forEach((step, idx) => {
                if (step.style.opacity === '0.3' && nextHidden === -1) nextHidden = idx;
            });

            if (nextHidden !== -1) {
                steps[nextHidden].style.opacity = '1';
                let allRevealed = true;
                steps.forEach(s => { if (s.style.opacity === '0.3') allRevealed = false; });
                
                if (allRevealed) {
                    progress.derivations[derivId] = true;
                    saveProgress();
                    renderDerivations(document.getElementById('main-content'));
                    renderMath();
                }
            }
        }

        function toggleSimulatorCheck(id) {
            progress.simulator[id] = !progress.simulator[id];
            saveProgress();
            renderSimulator(document.getElementById('main-content'));
        }

        function saveProgress() {
            localStorage.setItem('fn3142_progress_v2', JSON.stringify(progress));
            updateProgressBar();
        }

        function updateProgressBar() {
            const totalSteps = procedures.reduce((acc, p) => acc + p.steps.length, 0) + derivations.length;
            const completedSteps = Object.values(progress.procedures).reduce((acc, val) => acc + val, 0) + Object.keys(progress.derivations).length;
            const pct = Math.round((completedSteps / totalSteps) * 100);
            
            document.getElementById('progress-bar').style.width = `${pct}%`;
            document.getElementById('progress-text').innerText = `${pct}%`;
        }

        function resetProgress() {
            if (confirm('Are you sure you want to reset all your progress?')) {
                localStorage.removeItem('fn3142_progress_v2');
                progress = { procedures: {}, derivations: {}, simulator: {} };
                switchView('dashboard');
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                document.querySelector('button[onclick="switchView(\'dashboard\')"]').classList.add('active');
            }
        }

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            renderDashboard(document.getElementById('main-content'));
            renderMath();
            updateProgressBar();
        });

    </script>
</body>
</html>
