}
const patternTasks=[{label:'AR(3) process',correct:'pacf-cut',explain:'For AR(p), PACF cuts off after p, while ACF tails off.'},{label:'MA(2) process',correct:'acf-cut',explain:'For MA(q), ACF cuts off after q, while PACF tails off.'},{label:'ARMA(1,1) process',correct:'tails',explain:'For ARMA, both ACF and PACF generally tail off.'},{label:'White-noise process',correct:'both0',explain:'For white noise, both ACF and PACF are zero at every positive lag.'},{label:'AR(1) with φ = −0.6',correct:'pacf-cut',explain:'AR(1) PACF cuts off after lag 1; its ACF alternates in sign and decays in magnitude.'}];
function calculateAcf(){
 const p1=Number($('#phi1')?.value),p2=Number($('#phi2')?.value),out=$('#acfResult');if(!out||!Number.isFinite(p1)||!Number.isFinite(p2))return;
 const den=1-p2;if(Math.abs(den)<1e-9){out.innerHTML='<div class="feedback bad">1−φ₂ is zero, so this formula is undefined.</div>';return}
 const r=[1,p1/den];for(let k=2;k<11;k++)r[k]=p1*r[k-1]+p2*r[k-2];
 let stationary=true,roots=[];
 if(Math.abs(p2)<1e-9){if(Math.abs(p1)<1e-9){roots=[]}else roots=[1/p1];stationary=roots.length?Math.abs(roots[0])>1:true}
 else{const disc=p1*p1+4*p2;if(disc>=0){roots=[(-p1+Math.sqrt(disc))/(2*p2),(-p1-Math.sqrt(disc))/(2*p2)];stationary=roots.every(x=>Math.abs(x)>1)}else{const mod=Math.sqrt(Math.abs(-1/p2));stationary=mod>1;roots=[`complex pair, modulus ${mod.toFixed(3)}`]}}
 if(!stationary){out.innerHTML=`<div class="feedback bad">These coefficients do not satisfy the AR polynomial root condition for a stationary process. The displayed recursion is algebraic, but do not interpret it as a stationary ACF. Roots: ${roots.map(x=>typeof x==='number'?x.toFixed(3):x).join(', ')}.</div>`;return}
 out.innerHTML=`<div class="feedback good">Stationarity check: AR roots outside unit circle. Roots: ${roots.map(x=>typeof x==='number'?x.toFixed(3):x).join(', ')}.</div><div class="formula">ρ₁ = ${p1.toFixed(3)}/(1−(${p2.toFixed(3)})) = ${r[1].toFixed(4)}<br>ρ₂ = ${p1.toFixed(3)}(${r[1].toFixed(4)}) + (${p2.toFixed(3)})(1) = ${r[2].toFixed(4)}<br>ρₖ = ${p1.toFixed(3)}ρₖ₋₁ + (${p2.toFixed(3)})ρₖ₋₂</div><div class="tablewrap"><table><thead><tr><th>Lag</th>${r.slice(0,11).map((_,i)=>`<th>${i}</th>`).join('')}</tr></thead><tbody><tr><th>ρ(k)</th>${r.slice(0,11).map(x=>`<td>${x.toFixed(3)}</td>`).join('')}</tr></tbody></table></div><div style="display:flex;align-items:end;gap:7px;height:105px;margin-top:13px;border-bottom:1px solid var(--line);padding:0 5px">${r.slice(0,11).map((x,i)=>`<div title="lag ${i}: ${x.toFixed(3)}" style="flex:1;display:flex;align-items:center;justify-content:end;flex-direction:column;height:100%"><div style="width:65%;height:${Math.max(3,Math.abs(x)*76)}px;background:${x<0?'#b66b62':'#307c70'};border-radius:5px 5px 0 0"></div><span class="tiny">${i}</span></div>`).join('')}</div><p class="tiny">The recurrence generates the remaining lags. A stationary AR(2) ACF tails off (it may decay monotonically or oscillate depending on the roots).</p>`;
}
function setAcfExample(){$('#phi1').value='1.2';$('#phi2').value='-0.35';calculateAcf()}

 $('#mockArea').innerHTML=`<div class="card"><div class="between"><span class="smallcaps">Question ${m.i+1} / ${m.ids.length}</span><strong id="mockTimer" class="pill">${formatTime(m.left)}</strong></div><div class="progress" style="margin:10px 0 17px"><span style="width:${(m.i/m.ids.length)*100}%"></span></div><h3>${esc(q.q)}</h3><div style="margin-top:12px">${q.o.map((v,i)=>`<button class="option ${pick===i?'selected':''}" onclick="chooseMock(${i})"><strong>${String.fromCharCode(65+i)}.</strong> ${esc(v)}</button>`).join('')}</div><div class="between" style="margin-top:18px"><button class="btn" onclick="mockPrev()" ${m.i===0?'disabled':''}>Previous</button><span class="tiny">Answers are not revealed until submission.</span><button class="btn primary" onclick="mockNext()">${m.i===m.ids.length-1?'Submit exam':'Next question →'}</button></div></div>`;
}
function chooseMock(i){if(!mockSession)return;mockSession.picks[mockSession.i]=i;renderMockQuestion()}
function mockPrev(){if(mockSession&&mockSession.i>0){mockSession.i--;renderMockQuestion()}}
function mockNext(){if(!mockSession)return;if(mockSession.picks[mockSession.i]===undefined){toast('Select an answer before continuing.');return}if(mockSession.i===mockSession.ids.length-1)finishMock();else{mockSession.i++;renderMockQuestion()}}
function finishMock(){
 const m=mockSession;if(!m||m.submitted)return;m.submitted=true;clearInterval(mockTimer);let right=0;const results=m.ids.map((id,i)=>{const q=mcq[id],chosen=m.picks[i],ok=chosen===q.a;if(ok)right++;return {q,chosen,ok}});state.quiz.done=(state.quiz.done||0)+results.length;state.quiz.right=(state.quiz.right||0)+right;state.quiz.attempts=state.quiz.attempts||{count:0};state.quiz.attempts.count++;state.quiz.attempts.last={date:new Date().toISOString().slice(0,10),right,total:results.length};save();
 $('#mockArea').innerHTML=`<div class="card"><div class="kicker">Attempt submitted</div><h2>${right}/${results.length} correct · ${pct(right,results.length)}%</h2><div class="progress" style="margin:10px 0 15px"><span style="width:${pct(right,results.length)}%"></span></div><p>${right===results.length?'Excellent. Now preserve the reasoning by explaining each correct option aloud.':right>=15?'Good base. Review every missed explanation and retry with a different set.':'Use the explanations to repair the underlying concept, then retake.'}</p><button class="btn primary" onclick="startMock()">Retake with new question order</button> <button class="btn" onclick="nav('progress')">View progress</button><div class="divider"></div><h3>Answer review</h3>${results.map((r,i)=>`<details class="qa" style="margin:9px 0" ${r.ok?'':'open'}><summary><span>${i+1}. ${esc(r.q.q)}</span><span class="tag ${r.ok?'high':'low'}">${r.ok?'Correct':'Review'}</span></summary><div class="inside"><p><strong>Your answer:</strong> ${r.chosen===undefined?'No answer selected':esc(r.q.o[r.chosen])}</p><p><strong>Correct answer:</strong> ${esc(r.q.o[r.q.a])}</p><div class="callout">${esc(r.q.why)}</div></div></details>`).join('')}</div>`;
}

 const mastered=markCount(),rubricTotal=questions.reduce((s,q)=>s+q.rubric.length,0),rubricDone=Object.entries(state.rubrics).reduce((s,[id,a])=>s+a.filter(Boolean).length,0),reviewed=Object.keys(state.reviews).length,topics=[...new Set(questions.map(q=>q.area))];
 const topicsHtml=topics.map(t=>{const qs=questions.filter(q=>q.area===t);const n=qs.filter(q=>state.mastered[q.id]).length;return `<div style="margin:10px 0"><div class="between"><strong style="font-size:12px">${esc(t)}</strong><span class="tiny">${n}/${qs.length} mastered</span></div><div class="progress" style="margin-top:6px"><span style="width:${pct(n,qs.length)}%"></span></div></div>`}).join('');
 const plan=[['D0 · Build the base','Stationarity, ARMA representation, ACF/PACF and Yule–Walker. Complete answers 4, 6, 9, 10.'],['D+1 · Retrieval','Reproduce the four D0 answers without notes. Then cover Box–Jenkins and DF/ADF procedures.'],['D+3 · Forecast logic','Encompassing, combination, MZ and DM. Derive the combination weight and state every null.'],['D+7 · Interleaving','Mix ARMA, stationarity, ACF/PACF and forecast-evaluation questions. Use the procedure trainer in random order.'],['D+14 · Exam rehearsal','Complete a timed mock, then write two full 5-mark theory answers under exam conditions.']];
 $('#view-progress').innerHTML=`<div class="kicker">Readiness and study history</div><h2>Measure what you can reproduce</h2><p class="lead">This page tracks evidence of mastery in this browser: rubric points, due recall cards, procedure sequencing, and mock performance. It does not claim to measure an official exam grade.</p><div class="grid four"><div class="card"><div class="metric">${mastered}/10</div><div class="metriclabel">Answers mastered</div></div><div class="card"><div class="metric">${rubricDone}/${rubricTotal}</div><div class="metriclabel">Rubric points checked</div></div><div class="card"><div class="metric">${reviewed}/${flashcards.length}</div><div class="metriclabel">Cards reviewed</div></div><div class="card"><div class="metric">${dueCards().length}</div><div class="metriclabel">Cards due now</div></div></div><div class="grid two" style="margin-top:15px"><div class="card"><h3>Mastery by exam topic</h3>${topicsHtml}<div class="divider"></div><p class="tiny">A topic is “mastered” only when all five checklist elements for its target answer have been marked. Reopen mastered answers and test yourself again after a delay.</p></div><div class="card"><h3>Procedure scores</h3>${procedures.map(p=>`<div style="margin:11px 0"><div class="between"><strong style="font-size:12px">${esc(p.title)}</strong><span class="tiny">${state.procedure[p.id]===undefined?'Not attempted':Math.round(state.procedure[p.id]*100)+'%'}</span></div><div class="progress" style="margin-top:6px"><span style="width:${(state.procedure[p.id]||0)*100}%"></span></div></div>`).join('')}<div class="divider"></div><h3>Recall and mock record</h3><p class="tiny">MCQ record: ${state.quiz.right||0} correct out of ${state.quiz.done||0} submitted. Completed mock attempts: ${state.quiz.attempts?.count||0}.</p></div></div><div class="card" style="margin-top:15px"><div class="kicker">Spaced retrieval</div><h3>Revision schedule: D0 → D+1 → D+3 → D+7 → D+14</h3><div class="grid" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:9px">${plan.map(x=>`<div style="background:#f2f6f3;border:1px solid var(--line);border-radius:11px;padding:12px"><div class="smallcaps">${esc(x[0])}</div><p class="tiny" style="margin:8px 0 0">${esc(x[1])}</p></div>`).join('')}</div></div><div class="grid two" style="margin-top:15px"><div class="card"><h3>Export / import progress</h3><p class="tiny">Export a JSON backup before switching browsers or devices. GitHub Pages hosts the application only; it does not sync your localStorage between devices.</p><div class="row"><button class="btn primary" onclick="exportProgress()">Export progress JSON</button><label class="btn" for="importFile">Import backup</label><input type="file" id="importFile" accept="application/json" style="display:none" onchange="importProgress(this.files[0])"></div></div><div class="card"><h3>Reset local data</h3><p class="tiny">Resetting deletes notes, mastery ticks, flashcard scheduling and quiz totals stored in this browser. Export first if you want a backup.</p><button class="btn danger" onclick="resetAllProgress()">Reset progress and notes</button></div></div><div class="card" style="margin-top:15px"><div class="kicker">Evidence & coverage</div><h3>What the content is based on</h3><div class="tablewrap"><table><thead><tr><th>Source</th><th>Coverage used</th><th>Application treatment</th></tr></thead><tbody><tr><td><strong>FN3142 Subject Guide 2026</strong></td><td>Ch. 4 ARMA; Ch. 11 optimal forecasts; Ch. 12 forecast comparison / combination; Ch. 18 unit roots; further chapters on volatility, risk and high-frequency material.</td><td>Primary reference for definitions, derivations, test procedures and learning outcomes.</td></tr><tr><td><strong>Lecture slides (uploaded pack)</strong></td><td>Lectures 1–8: time-series foundations, ARMA, DF/ADF, forecasting, VAR/Granger/cointegration, financial stylised facts and ARCH introduction.</td><td>Used for lecture terminology and course emphasis. Later lecture slides were not in the supplied pack.</td></tr><tr><td><strong>Past papers & marking keys</strong></td><td>ARMA roots / forecasts, Box–Jenkins, DF/ADF, OLS vs ARMA, ACF/PACF, encompassing, forecast combination and MSE forecast-error properties.</td><td>Used to construct answer rubrics and identify exactly what the marked questions request.</td></tr><tr><td><strong>Revision-sheet learning design</strong></td><td>Retrieval questions, structured revision sheets, flashcards, progressive testing, comparison, and spaced review.</td><td>Used for study interactions, not for the finance content.</td></tr></tbody></table></div><div class="callout warn" style="margin-top:12px"><strong>Coverage qualification:</strong> The supplied materials explicitly evidence DF and ADF. Phillips–Perron and KPSS were not found in the uploaded Guide or lecture slides and therefore are not labelled as course tests here. The full course includes later topics beyond the uploaded Lecture 1–8 deck; the Study Guide is used for broader briefings, but consult your instructor’s final examinable-topic notice.</div><h3 style="margin-top:16px">Source points reconciled explicitly</h3><ul><li><strong>Out-of-sample wording:</strong> one past-paper solution has an awkward holdout-sample phrase; the application uses the correct concept: evaluate later holdout observations not used to fit the model.</li><li><strong>Yule–Walker normalisation:</strong> one line of the past-paper key appears to reverse the ratio. The correct definition used here is ρ(k)=γ(k)/γ(0), consistent with the Subject Guide.</li><li><strong>Root conventions:</strong> the app states the standard lag-polynomial convention (roots outside the unit circle); reciprocal characteristic roots are the equivalent inside-unit-circle convention.</li><li><strong>ARMA estimation:</strong> the general lecture method is MLE for MA/ARMA because innovations are unobserved. A specific ARMA(1,1) marking key also accepts a Yule–Walker method-of-moments route.</li><li><strong>Forecast-error properties:</strong> the MSE marking key lists four properties and awards full credit for any three in the cited question.</li></ul></div>`;
}
function exportProgress(){
 const data={application:'QF Mastery Lab',version:1,exportedAt:new Date().toISOString(),state};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='qf-mastery-progress.json';a.click();URL.revokeObjectURL(url);toast('Progress backup downloaded.');
}
function importProgress(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data.state||typeof data.state!=='object')throw new Error('Not a QF Mastery Lab backup');state={...blankState(),...data.state};save();renderProgress();toast('Progress imported.')}catch(e){alert('Could not import this file: '+e.message)}};reader.readAsText(file)}
function resetAllProgress(){if(confirm('Permanently clear all locally saved QF study progress on this browser?')){state=blankState();save();renderProgress();toast('Progress cleared.')}}

boot();

function renderCalcs(){
 $('#view-calcs').innerHTML=`<div class="kicker">Calculation lab · show every intermediate step</div><h2>Work the numbers, then interpret the test</h2><p class="lead">These calculators are not answer generators to copy blindly. Enter inputs, inspect the derivation, and practise writing the interpretation exactly as you would in the exam.</p>
 <div class="grid two"><div class="card"><div class="kicker">Forecast combination</div><h3>Find the MSE-optimal weight</h3><p class="tiny">Assume two unbiased forecasts and known error standard deviations / correlation.</p><div class="grid three"><div class="field"><label>σ₁</label><input id="cSig1" type="number" value="2" min="0.0001" step="0.1"></div><div class="field"><label>σ₂</label><input id="cSig2" type="number" value="3" min="0.0001" step="0.1"></div><div class="field"><label>ρ</label><input id="cRho" type="number" value="0.4" min="-1" max="1" step="0.05"></div></div><button class="btn primary" onclick="calculateCombination()">Derive optimal weight</button><div id="combResult" style="margin-top:13px"></div></div>
 <div class="card"><div class="kicker">Diebold–Mariano test</div><h3>Compare two forecasts</h3><p class="tiny">Uses the serial-independence worked-example formula in the Guide: DM=√T·d̄/ŝd.</p><div class="grid three"><div class="field"><label>Sample size T</label><input type="number" id="dmT" value="100" min="1" step="1"></div><div class="field"><label>Mean loss diff d̄</label><input type="number" id="dmMean" value="0.15" step="0.01"></div><div class="field"><label>SD of dₜ</label><input type="number" id="dmSd" value="0.6782" step="0.01"></div></div><button class="btn primary" onclick="calculateDM()">Calculate DM statistic</button><div id="dmResult" style="margin-top:13px"></div></div></div>
 <div class="grid two" style="margin-top:15px"><div class="card"><div class="kicker">Unit-root test decision</div><h3>DF / ADF rejection-region trainer</h3><p class="tiny">The statistic is left-tailed. Enter the critical value that corresponds to the deterministic specification and significance level in your course table.</p><div class="grid two"><div class="field"><label>Observed τ statistic</label><input type="number" id="dfTau" step="0.01" value="-3.10"></div><div class="field"><label>Critical value cα</label><input type="number" id="dfCrit" step="0.01" value="-2.86"></div></div><div class="field"><label>Specification / source convention</label><select id="dfSpec"><option value="intercept">Intercept · 5% approximate value in Subject Guide</option><option value="custom">Custom critical value supplied in the question</option></select></div><button class="btn primary" onclick="calculateDFDecision()">Make test decision</button><div id="dfResult" style="margin-top:13px"></div></div>
 <div class="card"><div class="kicker">How to write the conclusion</div><h3>Use a full inference sentence</h3><div class="callout"><strong>Test template:</strong><br>“At the [α]% significance level, the test statistic [does / does not] fall in the rejection region. I therefore [reject / fail to reject] H₀. The data [provide / do not provide] sufficient evidence of [the alternative] under the specified deterministic terms.”</div><p class="tiny" style="margin-top:12px">Replace the bracketed terms with the exact hypotheses and interpretation for the test. The decision sentence is not complete unless you identify the null and alternative.</p><div class="divider"></div><strong style="font-size:12px">DM direction template</strong><p class="tiny">“Because d̄ is [negative / positive], forecast [A / B] has the lower average loss. Since the DM null is [rejected / not rejected], this difference is [statistically significant / not statistically distinguishable] at the chosen level.”</p></div></div>
 <div class="card" style="margin-top:15px"><div class="kicker">Fill-in recall · DF / ADF specification</div><h3>Complete the test answer without looking</h3><p class="tiny">Choose the correct null, alternative, statistic, null distribution and rejection region. This is a direct check of the items required by the past-paper marking instruction.</p><div class="grid two"><div class="field"><label>Null hypothesis H₀</label><select id="dfRecallNull"><option value="">Choose…</option><option value="psi0">ψ = 0 (unit root)</option><option value="theta0">θ = 0</option><option value="psi1">ψ = 1</option></select></div><div class="field"><label>Alternative H₁</label><select id="dfRecallAlt"><option value="">Choose…</option><option value="psilt0">ψ &lt; 0 (stationary alternative)</option><option value="psigt0">ψ &gt; 0</option><option value="psi0">ψ = 0</option></select></div><div class="field"><label>Test statistic</label><select id="dfRecallStat"><option value="">Choose…</option><option value="tau">τ = ψ̂ / se(ψ̂)</option><option value="normal">z = ψ̂ / se(ψ̂), standard normal</option><option value="f">F = SSR restriction ratio</option></select></div><div class="field"><label>Null distribution</label><select id="dfRecallDist"><option value="">Choose…</option><option value="df">Non-standard Dickey–Fuller distribution</option><option value="normal">Standard normal</option><option value="student">Ordinary Student-t</option></select></div><div class="field"><label>Rejection region</label><select id="dfRecallRR"><option value="">Choose…</option><option value="left">Left tail: τ &lt; cα (sufficiently negative)</option><option value="right">Right tail: τ &gt; cα</option><option value="two">Two-sided: |τ| &gt; cα</option></select></div><div class="field"><label>Why does ADF add lagged differences?</label><select id="dfRecallWhy"><option value="">Choose…</option><option value="serial">To absorb serial correlation in the regression disturbance</option><option value="power">To increase the test statistic mechanically</option><option value="mean">To force the mean to zero</option></select></div></div><button class="btn primary" onclick="checkDfRecall()">Check the full specification</button><div id="dfRecallFeedback" style="margin-top:12px"></div></div>
 <div class="card" style="margin-top:15px"><div class="kicker">Exam procedure self-check</div><h3>Before you submit a calculation</h3><div class="grid three"><div><strong>Setup</strong><div class="checklist"><label class="checkrow"><input type="checkbox"> Define the objects and assumptions.</label><label class="checkrow"><input type="checkbox"> Write the equation before substituting.</label></div></div><div><strong>Derivation</strong><div class="checklist"><label class="checkrow"><input type="checkbox"> Show the FOC / statistic / recursion.</label><label class="checkrow"><input type="checkbox"> Check the SOC / distribution / roots.</label></div></div><div><strong>Interpretation</strong><div class="checklist"><label class="checkrow"><input type="checkbox"> State the decision rule.</label><label class="checkrow"><input type="checkbox"> Explain what the result means in context.</label></div></div></div></div>`;
}
function calculateCombination(){
 const s1=Number($('#cSig1').value),s2=Number($('#cSig2').value),rho=Number($('#cRho').value),o=$('#combResult');
 if(!(s1>0&&s2>0&&rho>=-1&&rho<=1)){o.innerHTML='<div class="feedback bad">Enter positive standard deviations and a correlation between −1 and 1.</div>';return}
 const den=s1*s1+s2*s2-2*rho*s1*s2;if(den<1e-10){o.innerHTML='<div class="feedback warn">The denominator is zero / nearly zero: the two forecast errors are perfectly collinear in this parameter configuration, so the interior weight is not uniquely identified.</div>';return}
 const num=s2*s2-rho*s1*s2,w=num/den,mse=w*w*s1*s1+(1-w)*(1-w)*s2*s2+2*w*(1-w)*rho*s1*s2,clamped=Math.min(1,Math.max(0,w));
 o.innerHTML=`<div class="formula">ω* = (σ₂²−ρσ₁σ₂)/(σ₁²+σ₂²−2ρσ₁σ₂)<br>= (${s2*s2.toFixed(3)}−${(rho*s1*s2).toFixed(3)}) / (${den.toFixed(3)})<br>= ${w.toFixed(4)}</div><div class="grid three" style="margin-top:10px"><div><div class="metric">${w.toFixed(3)}</div><div class="metriclabel">Weight on forecast 1</div></div><div><div class="metric">${(1-w).toFixed(3)}</div><div class="metriclabel">Weight on forecast 2</div></div><div><div class="metric">${mse.toFixed(3)}</div><div class="metriclabel">Combined MSE</div></div></div><p class="tiny">Unrestricted / unconstrained optimal weight. ${w>=0&&w<=1?'It lies within the convex interval [0,1].':`It lies outside [0,1]; for a constrained convex combination, compare the boundary solution (ω=${clamped.toFixed(3)}) with the unconstrained value.`}</p><p class="tiny">Compare with individual MSEs σ₁²=${(s1*s1).toFixed(3)} and σ₂²=${(s2*s2).toFixed(3)}. The combination MSE includes the covariance term; do not omit it in the derivation.</p>`;
}
function calculateDM(){
 const T=Number($('#dmT').value),d=Number($('#dmMean').value),sd=Number($('#dmSd').value),o=$('#dmResult');
 if(!(T>0&&sd>0)){o.innerHTML='<div class="feedback bad">T and the standard deviation must be positive.</div>';return}
 const dm=Math.sqrt(T)*d/sd,significant=Math.abs(dm)>1.96,winner=d<0?'A':d>0?'B':'Neither';
 o.innerHTML=`<div class="formula">DM = √T · d̄ / ŝd<br>= √${T} × ${d} / ${sd}<br>= ${dm.toFixed(4)}</div><div class="feedback ${significant?'good':'bad'}"><strong>${significant?'Reject H₀ at 5%.':'Fail to reject H₀ at 5%.'}</strong> |DM| ${significant?'>':'≤'} 1.96. ${d===0?'The sample mean loss differential is zero.':`d̄ is ${d<0?'negative':'positive'}, so forecast ${winner} has the lower sample average loss.`} ${significant?'The difference is statistically significant under the stated serial-independence assumption.':'The observed difference is not statistically distinguishable from zero under the stated assumption.'}</div><p class="tiny">Assumption: the supplied exercise formula treats loss differentials as serially independent. With autocorrelated loss differences, use an appropriate long-run variance estimate.</p>`;
}
function calculateDFDecision(){
 const tau=Number($('#dfTau').value),crit=Number($('#dfCrit').value),o=$('#dfResult');if(!Number.isFinite(tau)||!Number.isFinite(crit)){o.innerHTML='<div class="feedback bad">Enter both a test statistic and the matching critical value.</div>';return}
 const rej=tau<crit;
 o.innerHTML=`<div class="formula">Observed τ = ${tau.toFixed(3)}<br>Critical value cα = ${crit.toFixed(3)}<br>Rejection rule: τ &lt; cα</div><div class="feedback ${rej?'good':'bad'}"><strong>${rej?'Reject the unit-root null.':'Fail to reject the unit-root null.'}</strong> ${tau.toFixed(3)} ${rej.toString()==='true'?'<':'≥'} ${crit.toFixed(3)}. ${rej?'There is evidence against a unit root and in favour of stationarity under the chosen deterministic terms.':'There is insufficient evidence to reject a unit root under this specification; non-rejection is not proof of the null.'}</div><p class="tiny">Use the DF critical value for the deterministic terms and significance level in the question. The Study Guide reports approximately −2.86 at 5% for an intercept specification. Do not substitute standard Student-t / normal critical values.</p>`;
}

function checkDfRecall(){const vals={dfRecallNull:'psi0',dfRecallAlt:'psilt0',dfRecallStat:'tau',dfRecallDist:'df',dfRecallRR:'left',dfRecallWhy:'serial'};let score=0;const labels={dfRecallNull:'Unit-root null',dfRecallAlt:'Stationarity alternative',dfRecallStat:'Test statistic',dfRecallDist:'Null distribution',dfRecallRR:'Rejection region',dfRecallWhy:'ADF augmentation'};const misses=[];for(const [id,correct] of Object.entries(vals)){if($('#'+id).value===correct)score++;else misses.push(labels[id])}const feedback=$('#dfRecallFeedback');feedback.innerHTML=`<div class="feedback ${score===6?'good':'bad'}"><strong>${score}/6 correct.</strong> ${score===6?'Complete specification. Now reproduce it in words and explain why the distribution is non-standard.':'Review: '+misses.join(', ')+'.'} </div><p class="tiny">Correct structure: H₀:ψ=0; H₁:ψ&lt;0; τ=ψ̂/se(ψ̂); non-standard Dickey–Fuller critical values; left-tail rejection; ADF adds lagged ΔY to address serial correlation.</p>`}
</script>
